name: Feature-gated cache transaction cost research

on:
  pull_request:
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "crates/rawmocs-core/tests/cache_cost_profile.rs"
      - "benchmarks/rust_core/Cargo.toml"
      - "benchmarks/rust_core/examples/cache_profile.rs"
      - ".github/workflows/cache-cost.yml"
  push:
    branches: [main]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "crates/rawmocs-core/tests/cache_cost_profile.rs"
      - "benchmarks/rust_core/Cargo.toml"
      - "benchmarks/rust_core/examples/cache_profile.rs"
      - ".github/workflows/cache-cost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-cost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - name: Check uninstrumented core and research workspace format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
      - name: Clippy and exact tests with research-only profiling enabled
        run: |
          cargo clippy --workspace --all-targets --features cache-cost-profile -- -D warnings
          cargo test --workspace --features cache-cost-profile
          cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --all-targets --features cache-cost-profile -- -D warnings
          cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features cache-cost-profile
      - name: Source-locked Linux isolated transaction-cost cohort
        shell: bash
        run: |
          set -euo pipefail
          command -v prlimit
          cargo run --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --features cache-cost-profile --example cache_profile -- --cost-suite 2> "$RUNNER_TEMP/cache-cost-guards.log" | tee "$RUNNER_TEMP/cache-cost-profile.csv"
          grep -F "GUARD_MEMORY_DENIED=PASS STATUS=RESOURCE_FAILURE" "$RUNNER_TEMP/cache-cost-guards.log"
          grep -F "GUARD_TIMEOUT=PASS STATUS=TIMEOUT" "$RUNNER_TEMP/cache-cost-guards.log"
          python3 - "$RUNNER_TEMP/cache-cost-profile.csv" <<'PY'
          import csv
          import sys
          with open(sys.argv[1], newline="", encoding="utf-8") as source:
              rows = list(csv.DictReader(source))
          expected = {
              (str(n), str(trial), policy)
              for n in (6, 10, 14)
              for trial in range(3)
              for policy in ("off", "on", "tight")
          }
          actual = {(r["vertices"], r["trial"], r["policy"]) for r in rows}
          assert len(rows) == 27 and actual == expected, "missing/duplicate cost workers"
          for row in rows:
              value = lambda name: int(row[name])
              assert value("variables") == value("vertices") + 1
              assert value("solve_wall_ns") > 0 and value("process_peak_rss_kib") > 0
              assert value("root_normalize_calls") == 1
              assert value("recursive_normalize_calls") == value("nodes") - 1
              assert value("root_normalize_ns") > 0
              if value("recursive_normalize_calls"):
                  assert value("recursive_normalize_ns") > 0
              assert value("full_cache_lookup_calls") <= value("lookup_calls")
              assert value("full_cache_lookup_hits") <= value("full_cache_lookup_calls")
              assert value("full_cache_lookup_hits") <= value("cache_hits")
              if row["policy"] == "off":
                  assert all(value(name) == 0 for name in (
                      "cache_hits", "cache_entries", "cache_payload_rejections",
                      "key_build_calls", "lookup_calls", "hit_clone_calls",
                      "admission_calls", "insert_calls",
                      "full_cache_lookup_calls", "full_cache_lookup_hits"))
              else:
                  assert value("key_build_calls") == value("nodes")
                  assert value("lookup_calls") == value("key_build_calls")
                  assert value("hit_clone_calls") == value("cache_hits")
                  assert value("insert_calls") == value("cache_entries")
                  assert value("admission_calls") == (
                      value("insert_calls") + value("cache_payload_rejections"))
                  if row["policy"] == "on":
                      assert value("cache_hits") > 0
                  if row["policy"] == "tight":
                      assert value("cache_payload_rejections") > 0
          print("CACHE_COST_27_EXACT_ORACLE_AND_TRANSACTION_ROWS=PASS")
          PY
      - name: Upload isolated cache-cost research evidence
        uses: actions/upload-artifact@v4
        with:
          name: cache-cost-profile
          path: |
            ${{ runner.temp }}/cache-cost-profile.csv
            ${{ runner.temp }}/cache-cost-guards.log
          if-no-files-found: error
          retention-days: 30
