name: Cache payload and Linux RSS research profile

on:
  pull_request:
    paths:
      - "benchmarks/rust_core/examples/cache_profile.rs"
      - ".github/workflows/cache-profile.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/rust_core/examples/cache_profile.rs"
      - ".github/workflows/cache-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile -- -D warnings
      - run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml
      - name: Run separate Linux workers for each cache-cap and CNF case
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile | tee "$RUNNER_TEMP/cache-profile.csv"
          test "$(wc -l < "$RUNNER_TEMP/cache-profile.csv")" -eq 25
      - name: Upload source-scoped CSV evidence
        uses: actions/upload-artifact@v4
        with:
          name: cache-rss-profile
          path: ${{ runner.temp }}/cache-profile.csv
          if-no-files-found: error
          retention-days: 30
