name: Cache payload and Linux RSS research profile

on:
  pull_request:
    paths:
      - "benchmarks/rust_core/examples/cache_profile.rs"
      - "benchmarks/rust_core/src/cache_reuse.rs"
      - ".github/workflows/cache-profile.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/rust_core/examples/cache_profile.rs"
      - "benchmarks/rust_core/src/cache_reuse.rs"
      - ".github/workflows/cache-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile -- -D warnings
      - run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml
      - name: Run separate Linux workers for each cache-cap and CNF case
        shell: bash
        run: |
          set -euo pipefail
          command -v prlimit
          cargo run --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile 2> "$RUNNER_TEMP/guard-controls.log" | tee "$RUNNER_TEMP/cache-profile.csv"
          test "$(wc -l < "$RUNNER_TEMP/cache-profile.csv")" -eq 29
          grep -F "GUARD_MEMORY_DENIED=PASS STATUS=RESOURCE_FAILURE" "$RUNNER_TEMP/guard-controls.log"
          grep -F "GUARD_TIMEOUT=PASS STATUS=TIMEOUT" "$RUNNER_TEMP/guard-controls.log"
      - name: Compare optional logical cache quotas in fresh Linux workers
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile -- --quota-suite 2> "$RUNNER_TEMP/quota-guard-controls.log" | tee "$RUNNER_TEMP/cache-quota-profile.csv"
          grep -F "GUARD_MEMORY_DENIED=PASS STATUS=RESOURCE_FAILURE" "$RUNNER_TEMP/quota-guard-controls.log"
          grep -F "GUARD_TIMEOUT=PASS STATUS=TIMEOUT" "$RUNNER_TEMP/quota-guard-controls.log"
          test "$(wc -l < "$RUNNER_TEMP/cache-quota-profile.csv")" -eq 22
          head -n 1 "$RUNNER_TEMP/cache-quota-profile.csv" | grep -F 'family,variables,policy,cache_cap,solve_wall_ns,process_peak_rss_kib,nodes,cache_entries,cache_hits,decompositions,key_scope_items,key_clauses,key_literals,value_bits,max_value_bits,cache_payload_rejections'
          awk -F, 'NR>1 { count[$3]++; if ($5 <= 0 || $6 <= 0) exit 1; if ($3 == "tight" && $16 <= 0) exit 1; if ($3 != "tight" && $16 != 0) exit 1; if ($1 == "cache" && $3 != "tight" && $9 <= 0) exit 1 } END { if (count["legacy"] != 7 || count["tight"] != 7 || count["roomy"] != 7) exit 1 }' "$RUNNER_TEMP/cache-quota-profile.csv"
      - name: Measure repeatable cache-hit CNFs with rotated policy order
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile -- --repeat-suite 2> "$RUNNER_TEMP/repeat-guard-controls.log" | tee "$RUNNER_TEMP/cache-reuse-profile.csv"
          grep -F "GUARD_MEMORY_DENIED=PASS STATUS=RESOURCE_FAILURE" "$RUNNER_TEMP/repeat-guard-controls.log"
          grep -F "GUARD_TIMEOUT=PASS STATUS=TIMEOUT" "$RUNNER_TEMP/repeat-guard-controls.log"
          test "$(wc -l < "$RUNNER_TEMP/cache-reuse-profile.csv")" -eq 37
          awk -F, 'NR==1 { if (NF!=17 || $1!="gadgets" || $4!="policy") exit 1; next } { if (NF!=17 || $1!=4 && $1!=8 && $1!=16 || $2!=3*$1 || $3<0 || $3>2 || $6<=0 || $7<=0) exit 1; k=$1":"$3":"$4; if (++unique[k]!=1) exit 1; count[$4]++; if ($4=="off" && ($9!=0 || $10!=0 || $17!=0)) exit 1; if ($4=="tight" && ($10<1 || $17<=0)) exit 1; if (($4=="legacy" || $4=="roomy") && ($10<$1 || $17!=0)) exit 1 } END { for (i=1;i<=4;i++) { split("off legacy tight roomy", modes, " "); if (count[modes[i]]!=9) exit 1 } }' "$RUNNER_TEMP/cache-reuse-profile.csv"
      - name: Profile expensive shared connected cycles in isolated Linux workers
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile -- --cycle-suite 2> "$RUNNER_TEMP/cycle-guard-controls.log" | tee "$RUNNER_TEMP/connected-cycle-profile.csv"
          grep -F "GUARD_MEMORY_DENIED=PASS STATUS=RESOURCE_FAILURE" "$RUNNER_TEMP/cycle-guard-controls.log"
          grep -F "GUARD_TIMEOUT=PASS STATUS=TIMEOUT" "$RUNNER_TEMP/cycle-guard-controls.log"
          test "$(wc -l < "$RUNNER_TEMP/connected-cycle-profile.csv")" -eq 19
          awk -F, 'NR==1 {if (NF!=12 || $1!="vertices" || $4!="policy") exit 1; next} {if (NF!=12 || ($1!=6 && $1!=10 && $1!=14) || $2!=$1+1 || $3<0 || $3>2 || $5<=0 || $6<=0) exit 1; key=$1":"$3":"$4; if (++unique[key]!=1) exit 1; count[$4]++; nodes[key]=$7; if ($4=="off" && ($8!=0 || $9!=0)) exit 1; if ($4=="on" && $9<=0) exit 1} END {if (count["on"]!=9 || count["off"]!=9) exit 1; for (v=6;v<=14;v+=4) for (t=0;t<3;t++) if (nodes[v ":" t ":on"]>=nodes[v ":" t ":off"]) exit 1}' "$RUNNER_TEMP/connected-cycle-profile.csv"
      - name: Upload source-scoped CSV evidence
        uses: actions/upload-artifact@v4
        with:
          name: cache-rss-profile
          path: |
            ${{ runner.temp }}/cache-profile.csv
            ${{ runner.temp }}/cache-quota-profile.csv
            ${{ runner.temp }}/quota-guard-controls.log
            ${{ runner.temp }}/cache-reuse-profile.csv
            ${{ runner.temp }}/connected-cycle-profile.csv
            ${{ runner.temp }}/cycle-guard-controls.log
            ${{ runner.temp }}/repeat-guard-controls.log
            ${{ runner.temp }}/guard-controls.log
          if-no-files-found: error
          retention-days: 30
