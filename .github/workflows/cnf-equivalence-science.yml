name: Weighted CNF-only signed equivalence WMC science

on:
  pull_request:
    paths:
      - .github/workflows/cnf-equivalence-science.yml
      - benchmarks/mpfr_research/src/main.rs
      - benchmarks/mpfr_research/src/weighted_equivalence.rs
      - benchmarks/rust_core/tools/quprs_cnf_equivalence_ab.py
      - docs/cnf-equivalence-research.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-wmc-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/mpfr_research -> target
          key: equivalence-source-CNF
      - name: Exact signed literal equivalence WMC at 100/333 bits
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Strict new-code Clippy with inherited legacy research allowances
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path benchmarks/mpfr_research/Cargo.toml --all-targets -- -D warnings -A clippy::excessive_precision -A clippy::approx_constant -A clippy::manual_hash_one
      - name: Canonical new-module formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check benchmarks/mpfr_research/src/weighted_equivalence.rs


  format-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Emit canonical formatted module for source review
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 benchmarks/mpfr_research/src/weighted_equivalence.rs
          printf 'EQUIV_RUSTFMT_SOURCE %s\n' "$(base64 -w0 benchmarks/mpfr_research/src/weighted_equivalence.rs)"
