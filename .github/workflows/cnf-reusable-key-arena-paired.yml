name: Same-CNF original Feynman exact reusable key arena vs GPMC

on:
  pull_request:
    paths:
      - .github/workflows/cnf-reusable-key-arena-paired.yml
      - benchmarks/mpfr_research/src/main.rs
      - benchmarks/mpfr_research/src/trail_engine.rs
      - benchmarks/mpfr_research/src/factor_variable_elimination.rs
      - benchmarks/mpfr_research/tools/quprs_cnf_scoped_dsu_ab.py
      - benchmarks/mpfr_research/tools/quprs_cnf_trail_stage_profile.py
      - benchmarks/mpfr_research/tools/quprs_cnf_key_arena_ab.py
      - benchmarks/mpfr_research/tools/quprs_scope_stamp_paired.py
      - benchmarks/mpfr_research/tools/quprs_active_bitmap_paired.py
      - benchmarks/mpfr_research/tools/quprs_reversible_literal_mask_paired.py
      - benchmarks/mpfr_research/tools/quprs_fused_pre_paired.py
      - benchmarks/mpfr_research/tools/quprs_mqt_key_arena_ab.py
      - benchmarks/mpfr_research/src/factor_add_elimination.rs
      - benchmarks/mpfr_research/src/factor_pair_cutset_ve.rs
      - benchmarks/mpfr_research/src/factor_cutset_ve.rs
      - benchmarks/mpfr_research/src/factor_boolean_bdd.rs
      - docs/reusable-key-arena-research.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: same-cnf-reusable-key-arena-feynman-${{ github.event.pull_request.number || github.ref }}
  # Superseded research commits are not final-head evidence: avoid wasting
  # long source-locked GPMC builds on obsolete PR checkout revisions.
  cancel-in-progress: true

jobs:
  paired-weighted-cnf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            benchmarks/mpfr_research -> target
            .upstream/quprs/rust -> target
          key: same-cnf-reusable-key-arena-research
      - name: Focused Trail source-format and arena-oracle gates before expensive builds
        shell: bash
        run: |
          set -euo pipefail
          # This stacked research tree contains unrelated inherited formatting
          # debt. Validate the modified exact Trail solver directly instead.
          rustfmt --edition 2021 --check benchmarks/mpfr_research/src/trail_engine.rs
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_cnf_scoped_dsu_ab.py benchmarks/mpfr_research/tools/quprs_cnf_key_arena_ab.py benchmarks/mpfr_research/tools/quprs_arena_cross_family_acceptance.py \
            benchmarks/mpfr_research/tools/quprs_scope_stamp_paired.py \
            benchmarks/mpfr_research/tools/quprs_active_bitmap_paired.py \
            benchmarks/mpfr_research/tools/quprs_fused_pre_paired.py \
            benchmarks/mpfr_research/tools/quprs_reversible_literal_mask_paired.py
          python3 benchmarks/mpfr_research/tools/quprs_fused_pre_paired.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_reversible_literal_mask_paired.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_active_bitmap_paired.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_scope_stamp_paired.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_cnf_key_arena_ab.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_arena_cross_family_acceptance.py --self-test
      - name: Verify source lock, install native libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = 0b28736651b3740ed3b201edd2efdef3da541e0d
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time pkg-config
      - name: Build original unmodified QuPRS CNF fixture source
        shell: bash
        run: |
          set -euo pipefail
          cp benchmarks/rust_core/tools/quprs_long_feynman_reference.rs \
            .upstream/quprs/rust/quprs/examples/quprs_long_feynman_reference.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_long_feynman_reference
      - name: Freeze unchanged QuPRS CNFs as solver inputs, outside solver timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/weighted-cnf-articulation
          generator="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_long_feynman_reference"
          for case in feynman_hwb6 feynman_barenco_tof_5 feynman_mod_mult_55 feynman_grover_5; do
            timeout -k 2s 30s prlimit --as=2147483648 --fsize=2097152 -- \
              "$generator" "$case" "$GITHUB_WORKSPACE/.upstream/quprs" \
              "$GITHUB_WORKSPACE/.research/weighted-cnf-articulation" \
              > ".research/weighted-cnf-articulation/$case.export.log" 2>&1
            test -s ".research/weighted-cnf-articulation/$case-gpmc.cnf"
            sha256sum ".research/weighted-cnf-articulation/$case-gpmc.cnf"
          done
      - name: Build unchanged GPMC original C++ solver
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .upstream/gpmc -B .upstream/gpmc/build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Build exact reusable key arena solver and signed-complex parity tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release \
            --manifest-path benchmarks/mpfr_research/Cargo.toml
          cargo clippy --manifest-path benchmarks/mpfr_research/Cargo.toml \
            --all-targets -- -D warnings -A clippy::excessive_precision \
            -A clippy::approx_constant -A clippy::manual_hash_one
          cargo build --release \
            --manifest-path benchmarks/mpfr_research/Cargo.toml
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_cnf_scoped_dsu_ab.py
      - name: Source-locked Feynman GPMC Inline Ordered reusable arena and paired profile
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/mpfr_research/tools/quprs_cnf_key_arena_ab.py \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --corpus .research/weighted-cnf-articulation \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --report .research/weighted-cnf-articulation/arena-seven-arm.json \
            | tee .research/weighted-cnf-articulation/arena-study.log

      - name: Independent original Feynman GPMC versus Arena exact reversible literal mask native A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/mpfr_research/tools/quprs_reversible_literal_mask_paired.py \
            --family feynman --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --corpus .research/weighted-cnf-articulation \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --report .research/weighted-cnf-articulation/literal-mask-three-arm.json \
            | tee .research/weighted-cnf-articulation/literal-mask-three-arm.log

      - name: Preserve complete positive, negative and censored source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-quprs-weighted-cnf-key-arena-seven-arm
          path: .research/weighted-cnf-articulation/
          retention-days: 30
          if-no-files-found: warn
