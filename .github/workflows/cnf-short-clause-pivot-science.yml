name: Weighted CNF solver short-clause pivot research science

on:
  pull_request:
    paths:
      - .github/workflows/cnf-short-clause-pivot-science.yml
      - benchmarks/mpfr_research/src/main.rs
      - benchmarks/rust_core/tools/quprs_cnf_short_clause_pivot_ab.py
      - docs/quprs-cnf-short-clause-pivot-research.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-clause-pivot-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/mpfr_research -> target
          key: same-cnf-short-clause-pivot-science
      - name: Verify independent CNF-pivot WMC, SAT and 100/333-bit precision regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Verify no Rust compiler warnings or Clippy violations
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path benchmarks/mpfr_research/Cargo.toml --all-targets -- -D warnings -A clippy::excessive_precision -A clippy::approx_constant -A clippy::manual_hash_one
