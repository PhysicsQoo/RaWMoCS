name: Rust CodSpeed

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "benchmarks/rust_core/**"
      - "benchmarks/mpfr_research/**"
      - "codspeed.yml"
      - ".github/workflows/codspeed.yml"
  push:
    branches: [main]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "benchmarks/rust_core/**"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:
    inputs:
      study:
        description: 'Routine only, focused pair, or explicit milestone'
        type: choice
        options: [routine, grover5_focus, qpe8_prejoin, gf2_6_prejoin, gf2_6_axis_ab, legacy, grover6_large, wstate16]
        default: routine
      digits:
        type: choice
        options: ['30', '100']
        default: '30'

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench-smoke:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-long-codspeed' || github.event.label.name == 'run-prejoin-codspeed' || github.event.label.name == 'run-gf2-contraction-codspeed'
    name: Compile and validate Rust benchmarks (not a timing report)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml
      - run: cargo bench --locked --manifest-path benchmarks/rust_core/Cargo.toml --bench solver --no-run

  codspeed:
    name: CodSpeed simulation (opt in after repository connection)
    needs: bench-smoke
    if: >-
      vars.RAWMOCS_CODSPEED_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned original QuPRS test definitions
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Check out pinned same-source GPMC CNF generator
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: e3faa9c022bf93bc8ccebef7376e69d96367dd8e
          path: .upstream/gpmc
          persist-credentials: false
      - name: Generate source-locked identical GPMC/Rust QuPRS CNFs
        run: |
          test "$(git -C .upstream/gpmc hash-object benchmarks/quprs/prepare_direct_cnf.py)" = "0a6859c583f34725e59983380cedf1030d7da15b"
          python3 .upstream/gpmc/benchmarks/quprs/prepare_direct_cnf.py \
            --quprs .upstream/quprs --output "${RUNNER_TEMP}/quprs-cnf"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo install cargo-codspeed --version 6.0.0 --locked
      - name: Verify committed benchmark lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path benchmarks/rust_core/Cargo.toml --no-deps > /dev/null
      - name: Build instrumented solver microbenchmarks
        working-directory: benchmarks/rust_core
        run: cargo codspeed build -m simulation --locked --features quprs-gpmc-paired-research --bench solver --bench quprs_direct_cnf
      - name: Confirm instrumented build did not rewrite the lockfile
        run: git diff --exit-code -- benchmarks/rust_core/Cargo.lock
      - name: Upload all 62 legacy and six new paired CodSpeed identities in ONE workflow
        timeout-minutes: 5
        uses: CodSpeedHQ/action@v5
        env:
          GPMC_QU_PRS_CNF_DIR: ${{ runner.temp }}/quprs-cnf
        with:
          mode: simulation
          run: cd benchmarks/rust_core && cargo codspeed run --bench solver --bench quprs_direct_cnf

  source-locked-flamegraphs:
    if: >-
      vars.RAWMOCS_CODSPEED_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.study != 'routine') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'run-long-codspeed' || github.event.label.name == 'run-prejoin-codspeed' || github.event.label.name == 'run-gf2-contraction-codspeed')))
    runs-on: ubuntu-24.04
    # Build/reference overhead is separate from the bounded Simulation step.
    timeout-minutes: ${{ (github.event_name == 'pull_request' || inputs.study == 'grover5_focus' || inputs.study == 'qpe8_prejoin') && 25 || 35 }}
    env:
      STUDY: ${{ github.event.label.name == 'run-gf2-contraction-codspeed' && 'gf2_6_axis_ab' || github.event.label.name == 'run-prejoin-codspeed' && 'qpe8_prejoin' || github.event_name == 'pull_request' && 'grover5_focus' || inputs.study || 'grover5_focus' }}
      DIGITS: ${{ inputs.digits || '30' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            benchmarks/mpfr_research -> target
            .upstream/quprs/rust -> target
          key: original-cnf-mpfr-flamegraph-v1
      - name: Verify identical-source contracts and native libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = 0b28736651b3740ed3b201edd2efdef3da541e0d
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev pkg-config time
      - name: Build pinned original QuPRS CNF exporter
        if: env.STUDY == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          cp benchmarks/rust_core/tools/quprs_long_feynman_reference.rs \
            .upstream/quprs/rust/quprs/examples/quprs_long_feynman_reference.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_long_feynman_reference
      - name: Freeze three original Weighted CNF inputs outside CodSpeed profiling
        if: env.STUDY == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/codspeed-original-cnf
          generator="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_long_feynman_reference"
          for case in feynman_hwb6 feynman_mod_mult_55 feynman_barenco_tof_5; do
            timeout -k 2s 30s prlimit --as=2147483648 --fsize=2097152 -- \
              "$generator" "$case" "$GITHUB_WORKSPACE/.upstream/quprs" \
              "$GITHUB_WORKSPACE/.research/codspeed-original-cnf" \
              > ".research/codspeed-original-cnf/$case.export.log" 2>&1
            test -s ".research/codspeed-original-cnf/$case-gpmc.cnf"
          done
          printf '%s  %s\n' \
            e0381c270963e0715273530e48f159dc05b1cd96c9b85a556741a72a4289471d ".research/codspeed-original-cnf/feynman_hwb6-gpmc.cnf" \
            f8c76d883923363a7fcb5e32d6c6d8914f8443af3582fbe3d2e1d9c0b99c35b7 ".research/codspeed-original-cnf/feynman_mod_mult_55-gpmc.cnf" \
            f1fb459a058ba3dc17d2bd538a7e8b34e451383ae3384cb58a624bc8194499c3 ".research/codspeed-original-cnf/feynman_barenco_tof_5-gpmc.cnf" \
            | sha256sum -c -
      - name: Build pinned long source bridge
        if: env.STUDY != 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          cp benchmarks/rust_core/tools/quprs_long_tail_source_bridge.rs .upstream/quprs/rust/quprs/examples/quprs_long_tail_source_bridge.rs
          cargo build --locked --release --no-default-features --manifest-path .upstream/quprs/rust/Cargo.toml -p quprs --example quprs_long_tail_source_bridge
      - name: Build unchanged original GPMC C++ executable
        if: env.STUDY != 'gf2_6_prejoin' && env.STUDY != 'gf2_6_axis_ab'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Build unmodified Rust MPFR research DPLL and check science
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml
          cargo build --release --manifest-path benchmarks/mpfr_research/Cargo.toml
          git diff --exit-code -- benchmarks/mpfr_research/Cargo.lock
      - name: Qualify original long CNF and generate focused two-arm config
        if: env.STUDY != 'legacy' && env.STUDY != 'qpe8_prejoin' && env.STUDY != 'gf2_6_prejoin' && env.STUDY != 'gf2_6_axis_ab'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_long_codspeed.py
          flags=()
          if [[ "$STUDY" != grover5_focus ]]; then flags+=(--milestone); fi
          python3 benchmarks/mpfr_research/tools/quprs_long_codspeed.py prepare --case "$STUDY" --digits "$DIGITS" "${flags[@]}"
      - name: CodSpeed native process simulation and flamegraph capture
        if: env.STUDY == 'legacy'
        timeout-minutes: 20
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # The Action invokes CodSpeed itself; the config discovers all exec targets.
          # Do not nest `codspeed run` inside the CodSpeed Action.
          config: codspeed.yml
      - name: CodSpeed focused original CNF Simulation
        if: env.STUDY != 'legacy' && env.STUDY != 'qpe8_prejoin' && env.STUDY != 'gf2_6_prejoin' && env.STUDY != 'gf2_6_axis_ab'
        timeout-minutes: ${{ env.STUDY == 'grover5_focus' && 10 || 20 }}
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          config: codspeed-long.generated.yml
      - name: Verify actual simulated output and solver route
        if: env.STUDY != 'legacy' && env.STUDY != 'qpe8_prejoin' && env.STUDY != 'gf2_6_prejoin' && env.STUDY != 'gf2_6_axis_ab'
        shell: bash
        run: python3 benchmarks/mpfr_research/tools/quprs_long_codspeed.py verify
      - name: Checkout pinned pre-pair-mask Simulation baseline
        if: env.STUDY == 'gf2_6_axis_ab'
        uses: actions/checkout@v4
        with:
          ref: 5df2d9deec42ebbe42d00b0d23bb0e4dff682bb6
          path: .upstream/prejoin-simulation-baseline
          persist-credentials: false
      - name: Build both prejoin arms with identical dependency lock
        if: env.STUDY == 'gf2_6_axis_ab'
        shell: bash
        run: |
          set -euo pipefail
          base=.upstream/prejoin-simulation-baseline
          test "$(git -C "$base" rev-parse HEAD)" = 5df2d9deec42ebbe42d00b0d23bb0e4dff682bb6
          cmp "$base/benchmarks/mpfr_research/Cargo.toml" benchmarks/mpfr_research/Cargo.toml
          test -s benchmarks/mpfr_research/Cargo.lock
          if test -e "$base/benchmarks/mpfr_research/Cargo.lock"; then
            cmp "$base/benchmarks/mpfr_research/Cargo.lock" benchmarks/mpfr_research/Cargo.lock
          else
            cp benchmarks/mpfr_research/Cargo.lock "$base/benchmarks/mpfr_research/Cargo.lock"
          fi
          cargo build --locked --release --manifest-path benchmarks/mpfr_research/Cargo.toml
          cargo build --locked --release --manifest-path "$base/benchmarks/mpfr_research/Cargo.toml"
          cmp "$base/benchmarks/mpfr_research/Cargo.lock" benchmarks/mpfr_research/Cargo.lock
          git -C "$base" diff --exit-code -- benchmarks/mpfr_research/Cargo.toml benchmarks/mpfr_research/src
          mkdir -p .research/codspeed-prejoin
          cp benchmarks/mpfr_research/Cargo.lock .research/codspeed-prejoin/axis-ab.Cargo.lock
      - name: Qualify bounded prejoin native proxy
        if: env.STUDY == 'qpe8_prejoin' || env.STUDY == 'gf2_6_prejoin' || env.STUDY == 'gf2_6_axis_ab'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_prejoin_codspeed.py
          python3 benchmarks/mpfr_research/tools/quprs_prejoin_codspeed.py prepare
      - name: CodSpeed bounded prejoin proxy Simulation
        if: env.STUDY == 'qpe8_prejoin' || env.STUDY == 'gf2_6_prejoin' || env.STUDY == 'gf2_6_axis_ab'
        timeout-minutes: 10
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          config: codspeed-prejoin.generated.yml
      - name: Verify actual prejoin proxy outputs and routes
        if: env.STUDY == 'qpe8_prejoin' || env.STUDY == 'gf2_6_prejoin' || env.STUDY == 'gf2_6_axis_ab'
        run: python3 benchmarks/mpfr_research/tools/quprs_prejoin_codspeed.py verify
      - name: Report bounded prejoin Simulation stderr on failure
        if: failure() && (env.STUDY == 'qpe8_prejoin' || env.STUDY == 'gf2_6_prejoin' || env.STUDY == 'gf2_6_axis_ab')
        shell: bash
        run: |
          for f in .research/codspeed-prejoin/*.stderr; do
            if [[ -f "$f" ]]; then
              printf '%s\n' "$f"
              tail -c 4096 "$f"
              printf '\n'
            fi
          done
      - name: Archive exact Weighted CNF source checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-weighted-cnf-codspeed-source-provenance
          path: |
            .research/codspeed-original-cnf/*.cnf
            .research/codspeed-original-cnf/*.export.log
            codspeed.yml
            codspeed-long.generated.yml
            .research/codspeed-long/
            codspeed-prejoin.generated.yml
            .research/codspeed-prejoin/
          retention-days: 30
          if-no-files-found: warn
