name: Rust CodSpeed

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "benchmarks/rust_core/**"
      - ".github/workflows/codspeed.yml"
  push:
    branches: [main]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "benchmarks/rust_core/**"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench-smoke:
    name: Compile and validate Rust benchmarks (not a timing report)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path benchmarks/rust_core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path benchmarks/rust_core/Cargo.toml
      - run: cargo bench --manifest-path benchmarks/rust_core/Cargo.toml --bench solver --no-run
      - name: Export Cargo.lock from the known-good GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          test -s benchmarks/rust_core/Cargo.lock
          echo RAWMOCS_BENCH_CARGO_LOCK_BEGIN
          base64 -w0 benchmarks/rust_core/Cargo.lock
          echo
          echo RAWMOCS_BENCH_CARGO_LOCK_END

  codspeed:
    name: CodSpeed simulation (opt in after repository connection)
    needs: bench-smoke
    if: >-
      vars.RAWMOCS_CODSPEED_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo install cargo-codspeed --version 6.0.0 --locked
      - name: Build instrumented solver microbenchmarks
        working-directory: benchmarks/rust_core
        run: cargo codspeed build -m simulation --bench solver
      - name: Upload native CodSpeed results
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cd benchmarks/rust_core && cargo codspeed run --bench solver
