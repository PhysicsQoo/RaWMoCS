name: Rust CodSpeed

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "benchmarks/rust_core/**"
      - ".github/workflows/codspeed.yml"
  push:
    branches: [main]
    paths:
      - "crates/rawmocs-core/src/**"
      - "crates/rawmocs-core/Cargo.toml"
      - "benchmarks/rust_core/**"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench-smoke:
    name: Compile and validate Rust benchmarks (not a timing report)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml
      - run: cargo bench --locked --manifest-path benchmarks/rust_core/Cargo.toml --bench solver --no-run

  codspeed:
    name: CodSpeed simulation (opt in after repository connection)
    needs: bench-smoke
    if: >-
      vars.RAWMOCS_CODSPEED_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned original QuPRS test definitions
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Check out pinned same-source GPMC CNF generator
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: e3faa9c022bf93bc8ccebef7376e69d96367dd8e
          path: .upstream/gpmc
          persist-credentials: false
      - name: Generate source-locked identical GPMC/Rust QuPRS CNFs
        run: |
          test "$(git -C .upstream/gpmc hash-object benchmarks/quprs/prepare_direct_cnf.py)" = "0a6859c583f34725e59983380cedf1030d7da15b"
          python3 .upstream/gpmc/benchmarks/quprs/prepare_direct_cnf.py \
            --quprs .upstream/quprs --output "${RUNNER_TEMP}/quprs-cnf"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - run: cargo install cargo-codspeed --version 6.0.0 --locked
      - name: Verify committed benchmark lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path benchmarks/rust_core/Cargo.toml --no-deps > /dev/null
      - name: Build instrumented solver microbenchmarks
        working-directory: benchmarks/rust_core
        run: cargo codspeed build -m simulation --locked --features quprs-gpmc-paired-research --bench solver --bench quprs_direct_cnf
      - name: Confirm instrumented build did not rewrite the lockfile
        run: git diff --exit-code -- benchmarks/rust_core/Cargo.lock
      - name: Upload all 62 legacy and six new paired CodSpeed identities in ONE workflow
        uses: CodSpeedHQ/action@v5
        env:
          GPMC_QU_PRS_CNF_DIR: ${{ runner.temp }}/quprs-cnf
        with:
          mode: simulation
          run: cd benchmarks/rust_core && cargo codspeed run --bench solver --bench quprs_direct_cnf
