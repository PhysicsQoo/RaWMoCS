name: Certified Dubois20 bounded solver research

on:
  pull_request:
    paths:
      - "benchmarks/rust_core/**"
      - ".github/workflows/dubois-bounded-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dubois-bounded-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-dubois:
    name: Certified UNSAT or explicit UNKNOWN, source-pinned bounded runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - name: Verify unchanged SATLIB Boolean source
        run: |
          set -euo pipefail
          test "$(git hash-object benchmarks/rust_core/fixtures/satlib/dubois20.cnf)" = fbad81bb8793f08cd9b12b0028d4d741263edb5b
      - name: Rust format and opt-in research Clippy
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --all-targets --features canonical-mul-research -- -D warnings
      - name: Independent XOR certificate and bounded UNKNOWN-vs-UNSAT contract
        run: |
          cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features canonical-mul-research --test dubois_bounded_solver
          cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features canonical-mul-research dubois_xor_certificate
      - name: Bound native source-pinned three-mode results
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path benchmarks/rust_core/Cargo.toml --release --features canonical-mul-research --example dubois_bounded_paired
          timeout 180s cargo run --quiet --locked --manifest-path benchmarks/rust_core/Cargo.toml --release --features canonical-mul-research --example dubois_bounded_paired > dubois-bounded-evidence.tsv
          cat dubois-bounded-evidence.tsv
          test "$(grep -c '^PAIRED' dubois-bounded-evidence.tsv)" -eq 54
          test "$(grep -c '^SUMMARY' dubois-bounded-evidence.tsv)" -eq 6
          git diff --exit-code -- benchmarks/rust_core/Cargo.lock
      - name: Archive original verdict and resource records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo221-dubois-bounded-${{ github.sha }}
          path: dubois-bounded-evidence.tsv
          if-no-files-found: warn
          retention-days: 14
