name: Paired Gaussian zero-addition research (Linux)

on:
  pull_request:
    paths:
      - "crates/rawmocs-core/src/lib.rs"
      - "benchmarks/rust_core/examples/gaussian_add_paired.rs"
      - "benchmarks/rust_core/tools/paired_gaussian_add.py"
      - ".github/workflows/paired-gaussian-add.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-gaussian-add-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proposed optimization
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable pre-optimization main baseline
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 7dfae669fc1fef3a5e701666bf892ce042d44a83
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both full-WMC executables with the same Rust compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = 7dfae669fc1fef3a5e701666bf892ce042d44a83
          git merge-base --is-ancestor 7dfae669fc1fef3a5e701666bf892ce042d44a83 HEAD
          cargo build --locked --release --manifest-path baseline/benchmarks/rust_core/Cargo.toml --example cache_profile
          cargo build --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example cache_profile --example gaussian_add_paired
      - name: Same-process paired arithmetic with independent exact formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gaussian-paired"
          benchmarks/rust_core/target/release/examples/gaussian_add_paired --paired > "$RUNNER_TEMP/gaussian-paired/arithmetic.csv"
          python3 benchmarks/rust_core/tools/paired_gaussian_add.py "$RUNNER_TEMP/gaussian-paired/arithmetic.csv" | tee "$RUNNER_TEMP/gaussian-paired/arithmetic-summary.txt"
      - name: Same-runner alternate main/candidate exact Full WMC and process VmHWM
        shell: bash
        run: |
          set -euo pipefail
          for round in 0 1 2; do
            if (( round % 2 == 0 )); then order="baseline candidate"; else order="candidate baseline"; fi
            for kind in $order; do
              if [[ "$kind" = baseline ]]; then
                binary=baseline/benchmarks/rust_core/target/release/examples/cache_profile
              else
                binary=benchmarks/rust_core/target/release/examples/cache_profile
              fi
              "$binary" --cycle-suite > "$RUNNER_TEMP/gaussian-paired/$kind-$round.csv" 2> "$RUNNER_TEMP/gaussian-paired/$kind-$round.stderr"
              test "$(wc -l < "$RUNNER_TEMP/gaussian-paired/$kind-$round.csv")" -eq 19
              grep -qF 'GUARD_MEMORY_DENIED=PASS STATUS=RESOURCE_FAILURE' "$RUNNER_TEMP/gaussian-paired/$kind-$round.stderr"
              grep -qF 'GUARD_TIMEOUT=PASS STATUS=TIMEOUT' "$RUNNER_TEMP/gaussian-paired/$kind-$round.stderr"
            done
          done
          python3 benchmarks/rust_core/tools/paired_dpll_normalization.py "$RUNNER_TEMP/gaussian-paired" | tee "$RUNNER_TEMP/gaussian-paired/full-wmc-summary.txt"
      - name: Archive exact-paired witness without speedup claim
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaussian-add-paired-linux
          path: ${{ runner.temp }}/gaussian-paired/
          retention-days: 30
          if-no-files-found: warn
