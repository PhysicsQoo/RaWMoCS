name: Native Path-sum factor research

on:
  pull_request:
    paths:
      - benchmarks/rust_core/Cargo.toml
      - benchmarks/rust_core/src/lib.rs
      - benchmarks/rust_core/src/pathsum_factor_research.rs
      - .github/workflows/pathsum-factor-research.yml
      - docs/pathsum-factor-algebraic-research.md
      - benchmarks/rust_core/tools/quprs_pathsum_structural_probe.rs
      - benchmarks/rust_core/tools/quprs_pathsum_factor_export.rs
      - benchmarks/rust_core/examples/pathsum_factor_source_cli.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-science:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Research-only Rustfmt conformance
        run: rustfmt --edition 2021 --check benchmarks/rust_core/src/pathsum_factor_research.rs benchmarks/rust_core/examples/pathsum_factor_source_cli.rs benchmarks/rust_core/tools/quprs_pathsum_structural_probe.rs benchmarks/rust_core/tools/quprs_pathsum_factor_export.rs
      - name: Independent exact factor and restricted quadratic science tests
        run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research pathsum_factor_research -- --nocapture
      - name: Research-only code lint
        run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --lib -- -D warnings
      - name: Source factor parser independent tests
        run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --example pathsum_factor_source_cli
      - name: Source factor parser lint
        run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --example pathsum_factor_source_cli -- -D warnings

  pinned-quprs-structure:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable original QuPRS
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and build independent probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = "0b28736651b3740ed3b201edd2efdef3da541e0d"
          cp benchmarks/rust_core/tools/quprs_pathsum_structural_probe.rs \
             .upstream/quprs/rust/quprs/examples/quprs_pathsum_structural_probe.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_pathsum_structural_probe
      - name: Profile unmodified QASM and post-RR structural factors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/pathsum-structure
          probe="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_pathsum_structural_probe"
          : > .research/pathsum-structure/status.tsv
          for name in feynman_hwb6 feynman_qft4 mqt_qnn_4 mqt_grover_4 mqt_vqe_4 feynman_grover5 feynman_barenco5 feynman_modmult55; do
            for mode in raw rr; do
              target=".research/pathsum-structure/${name}-${mode}.tsv"
              if timeout -k 2s 30s prlimit --as=2147483648 -- \
                 "$probe" "$name" "$GITHUB_WORKSPACE/.upstream/quprs" "$mode" "$target" \
                 > ".research/pathsum-structure/${name}-${mode}.log" 2>&1; then
                printf '%s\t%s\tPROBED\n' "$name" "$mode" >> .research/pathsum-structure/status.tsv
                cat "$target"
              else
                printf '%s\t%s\tCENSORED_OR_UNSUPPORTED\n' "$name" "$mode" >> .research/pathsum-structure/status.tsv
                echo "PROFILE_CENSORED case=$name mode=$mode"
              fi
            done
          done
          cat .research/pathsum-structure/status.tsv
          grep -q 'PROBED' .research/pathsum-structure/status.tsv
      - name: Build exact Gaussian-only source export and independent native DP
        shell: bash
        run: |
          set -euo pipefail
          cp benchmarks/rust_core/tools/quprs_pathsum_factor_export.rs \
             .upstream/quprs/rust/quprs/examples/quprs_pathsum_factor_export.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_pathsum_factor_export
          cargo build --locked --release \
            --manifest-path benchmarks/rust_core/Cargo.toml \
            --features pathsum-factor-research \
            --example pathsum_factor_source_cli
      - name: QuPRS post-RR native factor exact oracle gate
        shell: bash
        run: |
          set -euo pipefail
          exporter="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_pathsum_factor_export"
          solver="$GITHUB_WORKSPACE/benchmarks/rust_core/target/release/examples/pathsum_factor_source_cli"
          : > .research/pathsum-structure/factor-admission.tsv
          for name in feynman_hwb6 feynman_qft4 mqt_qnn_4 mqt_grover_4 mqt_vqe_4 feynman_grover5 feynman_barenco5 feynman_modmult55; do
            if timeout -k 2s 30s prlimit --as=2147483648 -- \
               "$exporter" "$name" "$GITHUB_WORKSPACE/.upstream/quprs" \
               ".research/pathsum-structure" \
               > ".research/pathsum-structure/${name}-rr-factor-export.log" 2>&1; then
              "$solver" \
                ".research/pathsum-structure/${name}-rr-native-factor.txt" \
                ".research/pathsum-structure/${name}-rr-native-factor-oracle.tsv" \
                | tee ".research/pathsum-structure/${name}-rr-factor-match.log"
              printf '%s\tEXACT_ORACLE_MATCH\n' "$name" \
                 >> .research/pathsum-structure/factor-admission.tsv
            else
              printf '%s\tINELIGIBLE_OR_CENSORED\n' "$name" \
                 >> .research/pathsum-structure/factor-admission.tsv
              echo "SOURCE_FACTOR_UNQUALIFIED case=$name"
            fi
          done
          cat .research/pathsum-structure/factor-admission.tsv
          grep -q '^feynman_hwb6[[:space:]]EXACT_ORACLE_MATCH' \
            .research/pathsum-structure/factor-admission.tsv
          for case in feynman_grover5 feynman_barenco5 feynman_modmult55; do
            grep -q "^$case[[:space:]]EXACT_ORACLE_MATCH" \
              .research/pathsum-structure/factor-admission.tsv
          done
      - name: Wide original Feynman source-only structural scout (19-24 qubits)
        shell: bash
        run: |
          set -euo pipefail
          probe="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_pathsum_structural_probe"
          : > .research/pathsum-structure/wide-scout-status.tsv
          for name in feynman_barenco10 feynman_tof10 feynman_adder8; do
            for mode in raw rr; do
              target=".research/pathsum-structure/${name}-${mode}.tsv"
              log=".research/pathsum-structure/${name}-${mode}.log"
              result=0
              timeout -k 2s 30s prlimit --as=2147483648 -- \
                "$probe" "$name" "$GITHUB_WORKSPACE/.upstream/quprs" "$mode" "$target" \
                > "$log" 2>&1 || result=$?
              if [ "$result" -eq 0 ] && test -s "$target"; then
                status="PROFILE_COMPLETED"
                cat "$target"
              elif [ "$result" -eq 124 ]; then
                status="CENSORED_TIMEOUT"
              elif [ "$result" -eq 137 ] || [ "$result" -eq 143 ]; then
                status="CENSORED_RESOURCE_OR_SIGNAL"
              else
                status="CENSORED_SOURCE_ERROR"
              fi
              printf '%s\t%s\t%s\t%d\n' "$name" "$mode" "$status" "$result" \
                >> .research/pathsum-structure/wide-scout-status.tsv
              echo "WIDE_SOURCE_PROFILE case=$name mode=$mode status=$status exit=$result"
            done
          done
          test "$(wc -l < .research/pathsum-structure/wide-scout-status.tsv)" -eq 6
      - name: Archive immutable source-scoped profile and censored outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-quprs-pathsum-structural-profiles
          path: .research/pathsum-structure/
          retention-days: 30
          if-no-files-found: warn

