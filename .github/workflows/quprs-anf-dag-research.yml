name: QuPRS source ANF DAG research

on:
  pull_request:
    paths:
      - .github/workflows/quprs-anf-dag-research.yml
      - benchmarks/rust_core/Cargo.toml
      - benchmarks/rust_core/examples/anf_dag_profile.rs
      - benchmarks/rust_core/examples/anf_bitset_oracle.rs
      - benchmarks/rust_core/tools/quprs_pathsum_anf_dag_export.rs
      - docs/pathsum-factor-algebraic-research.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dag-science:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Canonical research source formatting
        run: rustfmt --edition 2021 --check benchmarks/rust_core/examples/anf_dag_profile.rs benchmarks/rust_core/examples/anf_bitset_oracle.rs benchmarks/rust_core/tools/quprs_pathsum_anf_dag_export.rs
      - name: GF2 ANF exact truth-table and resource admission tests
        run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --example anf_dag_profile
      - name: Research-only strict Clippy
        run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --example anf_dag_profile -- -D warnings
      - name: Exhaustive bit-parallel science versus independent scalar truth tables
        run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --example anf_bitset_oracle
      - name: Independent exhaustive-oracle Clippy
        run: cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --features pathsum-factor-research --example anf_bitset_oracle -- -D warnings

  pinned-anf-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile immutable QuPRS source ANF exporter and independent DAG profiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = 0b28736651b3740ed3b201edd2efdef3da541e0d
          cp benchmarks/rust_core/tools/quprs_pathsum_anf_dag_export.rs \
             .upstream/quprs/rust/quprs/examples/quprs_pathsum_anf_dag_export.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_pathsum_anf_dag_export
          cargo build --locked --release \
            --manifest-path benchmarks/rust_core/Cargo.toml \
            --features pathsum-factor-research \
            --example anf_dag_profile
          cargo build --locked --release \
            --manifest-path benchmarks/rust_core/Cargo.toml \
            --features pathsum-factor-research \
            --example anf_bitset_oracle
      - name: Profile unchanged original Adder8, Toffoli10, Barenco10 and HWB6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/anf-dag
          exporter="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_pathsum_anf_dag_export"
          profiler="$GITHUB_WORKSPACE/benchmarks/rust_core/target/release/examples/anf_dag_profile"
          : > .research/anf-dag/status.tsv
          for name in feynman_adder8 feynman_tof10 feynman_barenco10 feynman_hwb6; do
            case "$name" in
              feynman_adder8) qasm="adder_8.qasm" ;;
              feynman_tof10) qasm="tof_10.qasm" ;;
              feynman_barenco10) qasm="barenco_tof_10.qasm" ;;
              feynman_hwb6) qasm="hwb6.qasm" ;;
            esac
            src=".research/anf-dag/${name}.anf"
            result=".research/anf-dag/${name}-profile.tsv"
            log=".research/anf-dag/${name}.log"
            exit_code=0
            {
              echo "CASE=$name"
              sha256sum ".upstream/quprs/benchmarks/Feynman/$qasm"
              timeout -k 2s 30s prlimit --as=2147483648 -- \
                "$exporter" "$name" "$GITHUB_WORKSPACE/.upstream/quprs" "$src"
              /usr/bin/time -f 'DAG_PROFILE_PEAK_RSS_KIB=%M' -o "${log}.rss" \
                timeout -k 2s 30s prlimit --as=2147483648 -- \
                "$profiler" "$src" "$result"
            } > "$log" 2>&1 || exit_code=$?
            if [ "$exit_code" -eq 0 ] && test -s "$result"; then
              printf '%s\tCOMPLETED\t0\n' "$name" >> .research/anf-dag/status.tsv
              cat "$result"
            else
              printf '%s\tCENSORED\t%d\n' "$name" "$exit_code" >> .research/anf-dag/status.tsv
              echo "ANF_DAG_PROFILE_CENSORED case=$name exit=$exit_code"
            fi
          done
          cat .research/anf-dag/status.tsv
          grep -q '^feynman_adder8[[:space:]]COMPLETED[[:space:]]0' .research/anf-dag/status.tsv
          awk -F '\t' 'NR==2 { if ($2 != 24 || $6 < 14000 || $10 < 1) exit 1 }' \
            .research/anf-dag/feynman_adder8-profile.tsv
      - name: Bounded multi-output ROBDD count with source-verified controls
        shell: bash
        run: |
          set -euo pipefail
          profiler="$GITHUB_WORKSPACE/benchmarks/rust_core/target/release/examples/anf_dag_profile"
          : > .research/anf-dag/joint-bdd-status.tsv
          for name in feynman_adder8 feynman_tof10 feynman_barenco10 feynman_hwb6; do
            src=".research/anf-dag/${name}.anf"
            dst=".research/anf-dag/${name}-joint-bdd.tsv"
            log=".research/anf-dag/${name}-joint-bdd.log"
            code=0
            /usr/bin/time -f 'JOINT_BDD_RSS_KIB=%M' -o "${log}.rss" \
              timeout -k 2s 30s prlimit --as=2147483648 -- \
              "$profiler" --joint-bdd "$src" "$dst" > "$log" 2>&1 || code=$?
            if [ "$code" -eq 0 ] && test -s "$dst"; then
              value="$(awk -F '\t' 'NR==2 {print $10}' "$dst")"
              status="COMPLETED_NEEDS_INDEPENDENT_ORACLE"
              case "$name" in
                feynman_tof10)
                  test "$value" = "393216"
                  status="KNOWN_EXACT_ORACLE_MATCH"
                  ;;
                feynman_barenco10)
                  test "$value" = "523776"
                  status="KNOWN_EXACT_ORACLE_MATCH"
                  ;;
                feynman_hwb6)
                  test "$value" = "4"
                  status="KNOWN_EXACT_ORACLE_MATCH"
                  ;;
              esac
              printf '%s\t%s\t0\n' "$name" "$status" \
                >> .research/anf-dag/joint-bdd-status.tsv
              cat "$dst"
            else
              printf '%s\tCENSORED\t%d\n' "$name" "$code" \
                >> .research/anf-dag/joint-bdd-status.tsv
              echo "ANF_JOINT_BDD_CENSORED case=$name exit=$code"
            fi
          done
          cat .research/anf-dag/joint-bdd-status.tsv
          for case in feynman_tof10 feynman_barenco10 feynman_hwb6; do
            grep -q "^$case[[:space:]]KNOWN_EXACT_ORACLE_MATCH" \
              .research/anf-dag/joint-bdd-status.tsv
          done
      - name: Fully enumerate original Adder8 Boolean assignments without BDD
        shell: bash
        run: |
          set -euo pipefail
          oracle="$GITHUB_WORKSPACE/benchmarks/rust_core/target/release/examples/anf_bitset_oracle"
          : > .research/anf-dag/exhaustive-oracle-status.tsv
          for name in feynman_adder8 feynman_tof10 feynman_barenco10 feynman_hwb6; do
            source=".research/anf-dag/${name}.anf"
            dst=".research/anf-dag/${name}-exhaustive.tsv"
            log=".research/anf-dag/${name}-exhaustive.log"
            bdd=".research/anf-dag/${name}-joint-bdd.tsv"
            code=0
            /usr/bin/time -f 'EXHAUSTIVE_SOURCE_RSS_KIB=%M' -o "${log}.rss" \
              timeout -k 2s 75s prlimit --as=2147483648 -- \
              "$oracle" "$source" "$dst" > "$log" 2>&1 || code=$?
            if [ "$code" -eq 0 ] && test -s "$dst"; then
              bitset_real="$(awk -F '\t' 'NR==2 {print $6}' "$dst")"
              bitset_sat="$(awk -F '\t' 'NR==2 {print $5}' "$dst")"
              bitset_imag="$(awk -F '\t' 'NR==2 {print $7}' "$dst")"
              bdd_real="$(awk -F '\t' 'NR==2 {print $10}' "$bdd")"
              bdd_sat="$(awk -F '\t' 'NR==2 {print $9}' "$bdd")"
              bdd_imag="$(awk -F '\t' 'NR==2 {print $11}' "$bdd")"
              if [ "$bitset_real" != "$bdd_real" ] ||
                 [ "$bitset_sat" != "$bdd_sat" ] ||
                 [ "$bitset_imag" != "$bdd_imag" ]; then
                echo "EXHAUSTIVE_ORACLE_MISMATCH case=$name bitset=$bitset_real bdd=$bdd_real"
                exit 1
              fi
              printf '%s\tEXHAUSTIVE_MATCH\t0\n' "$name" \
                >> .research/anf-dag/exhaustive-oracle-status.tsv
              cat "$dst"
            else
              printf '%s\tCENSORED\t%d\n' "$name" "$code" \
                >> .research/anf-dag/exhaustive-oracle-status.tsv
              echo "EXHAUSTIVE_SOURCE_ORACLE_CENSORED case=$name exit=$code"
            fi
          done
          cat .research/anf-dag/exhaustive-oracle-status.tsv
          grep -q '^feynman_adder8[[:space:]]EXHAUSTIVE_MATCH' \
            .research/anf-dag/exhaustive-oracle-status.tsv
      - name: Export independent GPMC CNF from exactly the same Adder8 RR source
        shell: bash
        run: |
          set -euo pipefail
          exporter="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_pathsum_anf_dag_export"
          source=".research/anf-dag/feynman_adder8.anf"
          secondary=".research/anf-dag/feynman_adder8-gpmc.anf"
          cnf=".research/anf-dag/feynman_adder8-gpmc.cnf"
          code=0
          timeout -k 2s 45s prlimit --as=2147483648 -- \
            "$exporter" feynman_adder8 "$GITHUB_WORKSPACE/.upstream/quprs" \
            "$secondary" "$cnf" \
            > .research/anf-dag/feynman_adder8-gpmc-export.log 2>&1 || code=$?
          if [ "$code" -eq 0 ] && test -s "$cnf"; then
            cmp "$source" "$secondary"
            printf 'SAME_RR_EXPORTED\t0\n' > .research/anf-dag/gpmc-source-status.tsv
            sha256sum "$source" "$cnf"
          else
            printf 'CENSORED_OR_UNSUPPORTED\t%d\n' "$code" \
              > .research/anf-dag/gpmc-source-status.tsv
            echo "INDEPENDENT_GPMC_SOURCE_CENSORED exit=$code"
          fi
      - name: Retain both negative and positive source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-quprs-anf-dag-source-structural
          path: .research/anf-dag/
          retention-days: 30
          if-no-files-found: warn

  independent-adder8-gpmc:
    needs: pinned-anf-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          submodules: recursive
          path: .upstream/gpmc
          persist-credentials: false
      - name: Download source-locked post-RR Adder8 evidence
        uses: actions/download-artifact@v4
        with:
          name: original-quprs-anf-dag-source-structural
          path: .research/anf-dag/
      - name: Check availability of independently generated GPMC CNF
        id: cnf
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          if test -s .research/anf-dag/feynman_adder8-gpmc.cnf; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'ADDER_GPMC_ORACLE_CENSORED_SOURCE'
          fi
      - name: Install GPMC build requirements
        if: steps.cnf.outputs.available == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev pkg-config time
      - name: Build unchanged source-pinned GPMC C++ solver
        if: steps.cnf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Independently confirm SAT and exact integer with GPMC or preserve censoring
        if: steps.cnf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/gpmc-adder8
          code=0
          /usr/bin/time -f 'GPMC_PEAK_RSS_KIB=%M' -o .research/gpmc-adder8/rss.log \
            timeout -k 2s 90s prlimit --as=2147483648 -- \
            .upstream/gpmc/build/gpmc -mode=1 -prec=30 \
            .research/anf-dag/feynman_adder8-gpmc.cnf \
            > .research/gpmc-adder8/stdout.log \
            2> .research/gpmc-adder8/stderr.log || code=$?
          echo "$code" > .research/gpmc-adder8/exit.txt
          if [ "$code" -ne 0 ]; then
            echo "ADDER_GPMC_ORACLE_CENSORED_NATIVE_EXIT=$code" \
              | tee .research/gpmc-adder8/status.txt
            exit 0
          fi
          python3 - <<'PY'
          from fractions import Fraction
          from pathlib import Path
          import json
          import sys
          sys.path.insert(0, "benchmarks/rust_core/tools")
          from quprs_paired_native import parse_out
          original = Path(".research/gpmc-adder8/stdout.log").read_text()
          sat, (real, imag) = parse_out(original, "gpmc")
          fields = Path(".research/anf-dag/feynman_adder8-joint-bdd.tsv").read_text().splitlines()[1].split("\t")
          if len(fields) != 14 or fields[0] != "JOINT_BDD_COMPLETE":
              raise SystemExit("INDEPENDENT_GPMC_BDD_CENSORED_OR_UNPARSABLE")
          bdd_sat = fields[8] == "true"
          bdd_real = Fraction(fields[9])
          bdd_imag = Fraction(fields[10])
          if sat != bdd_sat or real != bdd_real or imag != bdd_imag:
              raise SystemExit(f"INDEPENDENT_GPMC_BDD_MISMATCH GPMC={sat,real,imag} BDD={bdd_sat,bdd_real,bdd_imag}")
          Path(".research/gpmc-adder8/status.txt").write_text(
              "EXACT_MATCHED_SAME_RR_GPMC_BDD\n"
          )
          Path(".research/gpmc-adder8/comparison.json").write_text(json.dumps({
              "status":"EXACT_MATCHED_SAME_RR_GPMC_BDD",
              "source_quprs_sha":"0b28736651b3740ed3b201edd2efdef3da541e0d",
              "source_gpmc_sha":"89bbc89d0de918e7a5385740355df55765039230",
              "sat":sat,"count_real":str(real),"count_imag":str(imag),
              "counting_scope":"phase-free unit-weight original post-RR Adder8"
          },indent=2)+"\n")
          print("ADDER_GPMC_ROBDD_SOURCE_EXACT_MATCH", sat, real, imag)
          PY
      - name: Retain independent WMC evidence or censored result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-adder8-bounded-bdd-vs-gpmc-oracle
          path: .research/gpmc-adder8/
          retention-days: 30
          if-no-files-found: warn

  rustfmt-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Emit canonical independent source oracle
        shell: bash
        run: |
          set -euo pipefail
          file=benchmarks/rust_core/examples/anf_bitset_oracle.rs
          rustfmt --edition 2021 "$file"
          printf 'BITSET_FMT_CANDIDATE %s %s\n' "$file" "$(base64 -w0 "$file")"
