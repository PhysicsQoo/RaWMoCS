name: QuPRS direct-CNF paired Rust research

on:
  pull_request:
    paths:
      - benchmarks/rust_core/benches/quprs_direct_cnf.rs
      - benchmarks/rust_core/Cargo.toml
      - .github/workflows/quprs-direct-cnf-paired.yml
      - docs/qoo-227-gpmc-codspeed-paired.md
      - benchmarks/rust_core/tools/quprs_paired_native.py
      - benchmarks/rust_core/examples/quprs_native_cli.rs
  push:
    branches: [main]
    paths:
      - benchmarks/rust_core/benches/quprs_direct_cnf.rs
      - benchmarks/rust_core/Cargo.toml
      - .github/workflows/quprs-direct-cnf-paired.yml
      - docs/qoo-227-gpmc-codspeed-paired.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rawmocs-quprs-paired-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-rust-smoke:
    name: Pinned identical source CNFs / exact Rust WMC benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GPMC_QU_PRS_CNF_DIR: ${{ github.workspace }}/.research/quprs-cnf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original QuPRS direct-CNF source
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Same pinned GPMC/QuPRS fixture generator as C++ benchmarking
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 8dbf7f45d3e808f8c27c4c5f5e69eeb271cd0adb
          path: .upstream/gpmc
          persist-credentials: false
      - name: Confirm shared generator and original QuPRS source, generate exact same CNF bytes
        run: |
          test "$(git -C .upstream/gpmc hash-object benchmarks/quprs/prepare_direct_cnf.py)" = "0a6859c583f34725e59983380cedf1030d7da15b"
          python3 .upstream/gpmc/benchmarks/quprs/prepare_direct_cnf.py \
            --quprs .upstream/quprs --output "$GPMC_QU_PRS_CNF_DIR"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - name: Rustfmt and strict Clippy on optional paired bench
        run: |
          cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml \
            --all-targets --features quprs-gpmc-paired-research -- -D warnings
      - name: Source-locked exact printed-CNF tests
        run: cargo test --locked --manifest-path benchmarks/rust_core/Cargo.toml quprs_printed_cnf
      - name: Run all six Rust paired benchmarks, fail closed on wrong Full WMC
        run: |
          cargo bench --locked --manifest-path benchmarks/rust_core/Cargo.toml \
            --features quprs-gpmc-paired-research --bench quprs_direct_cnf
      - uses: actions/upload-artifact@v4
        with:
          name: identical-quprs-test-defined-cnf-rust-side
          path: ${{ github.workspace }}/.research/quprs-cnf/
          if-no-files-found: error
          retention-days: 14

# CodSpeed is uploaded exclusively by codspeed.yml (one workflow per SHA).

  paired-native-walltime:
    name: Fresh-process C++ GPMC vs Rust RaWMoCS on same Linux runner
    needs: paired-rust-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 8dbf7f45d3e808f8c27c4c5f5e69eeb271cd0adb
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - name: Verify exact source corpus and both solver inputs
        run: |
          test "$(git -C .upstream/gpmc hash-object benchmarks/quprs/prepare_direct_cnf.py)" = "0a6859c583f34725e59983380cedf1030d7da15b"
          mkdir -p .research/quprs-cnf
          python3 .upstream/gpmc/benchmarks/quprs/prepare_direct_cnf.py \
            --quprs .upstream/quprs --output .research/quprs-cnf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - name: Install native C++ dependencies plus GNU process RSS sampler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time
      - name: Build unchanged original native GPMC C++ CLI (no research hooks)
        run: |
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGPMC_BUILD_QU_PRS_BENCHMARKS=OFF
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Build real native RaWMoCS Rust exact rational CLI
        run: |
          cargo build --locked --release \
            --manifest-path benchmarks/rust_core/Cargo.toml --example quprs_native_cli
      - name: Paired same-runner fresh-child WallTime/RSS and independent oracle
        run: |
          python3 benchmarks/rust_core/tools/quprs_paired_native.py \
            --gpmc .upstream/gpmc/build/gpmc \
            --rawmocs benchmarks/rust_core/target/release/examples/quprs_native_cli \
            --corpus .research/quprs-cnf --trials 3 \
            --out .research/quprs-paired-native-walltime.json
      - name: Preserve immutable per-trial data for scientific review
        uses: actions/upload-artifact@v4
        with:
          name: source-locked-quprs-gpmc-rawmocs-native-paired
          path: |
            .research/quprs-cnf/
            .research/quprs-paired-native-walltime.json
          retention-days: 30
          if-no-files-found: error
