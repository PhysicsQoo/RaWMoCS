name: QuPRS original encoder-emitted weighted-CNF study

on:
  pull_request:
    paths:
      - ".github/workflows/quprs-encoder-source-capture.yml"
      - "benchmarks/rust_core/tools/quprs_encoder_validate.py"
      - "benchmarks/rust_core/tools/quprs_paired_encoder.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/quprs-encoder-source-capture.yml"
      - "benchmarks/rust_core/tools/quprs_encoder_validate.py"
      - "benchmarks/rust_core/tools/quprs_encoder_paired.py"
      - "benchmarks/rust_core/tools/quprs_representative_reference.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quprs-encoder-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-encoder-source-capture:
    name: Original Rust PathSum/WmcManager source CNF provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUPRS_SOLVER_PROVISION: external
    steps:
      - name: RaWMoCS benchmark research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact original QuPRS Rust encoder exporter source
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Confirm untouched original QuPRS exporter Git blob
        run: |
          test "$(git -C .upstream/quprs rev-parse HEAD)" = "0b28736651b3740ed3b201edd2efdef3da541e0d"
          test "$(git -C .upstream/quprs hash-object rust/quprs/examples/interval_cnf_reference.rs)" = "f9b0bb4afba35a9a67a1b9d2844be3b77884b27a"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .upstream/quprs/rust -> target
          key: quprs-pinned-quprs-exporter-0b287366
      - name: Build and run real QuPRS miter PathSum/WmcManager exporter
        run: |
          mkdir -p .research/quprs-encoder
          cargo run --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example interval_cnf_reference -- \
            "$GITHUB_WORKSPACE/.research/quprs-encoder" \
            | tee .research/quprs-encoder/exporter.log
      - name: Validate all six real emitted GPMC/Ganak dialects and raw phase records
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_encoder_validate.py
          python3 benchmarks/rust_core/tools/quprs_encoder_validate.py \
            --quprs .upstream/quprs \
            --corpus .research/quprs-encoder \
            --manifest .research/quprs-encoder-manifest.json
      - name: Checkout pinned released GPMC native C++ source
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - name: Native GPMC/GMP/MPFR and RSS measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time
      - name: Build unchanged native GPMC C++ solver
        run: |
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Build native RaWMoCS printed-decimal exact-rational solver
        run: |
          cargo build --locked --release --manifest-path benchmarks/rust_core/Cargo.toml --example quprs_native_cli
      - name: Independent exhaustive oracle plus same-runner native GPMC/Rust process WallTime RSS
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_paired_encoder.py
          python3 benchmarks/rust_core/tools/quprs_paired_encoder.py \
            --corpus .research/quprs-encoder \
            --manifest .research/quprs-encoder-manifest.json \
            --gpmc .upstream/gpmc/build/gpmc \
            --rawmocs benchmarks/rust_core/target/release/examples/quprs_native_cli \
            --trials 3 --report .research/quprs-encoder-native-paired.json
      - name: Archive real encoder bytes, raw phase sidecars and SHA256 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quprs-emitted-cnf-native-parity
          path: |
            .research/quprs-encoder/
            .research/quprs-encoder-manifest.json
            .research/quprs-encoder-native-paired.json
          if-no-files-found: warn
          retention-days: 30
