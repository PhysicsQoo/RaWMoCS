  original-long-tail-source-locked-pilot:
    # Keep one existing workflow, parallelize the three previously
    # source-qualified hard cases with independent timeout/artifact.
    needs: original-long-tail-source-locked-screen
    if: ${{ !cancelled() && ((inputs.suite == 'full' && needs.original-long-tail-source-locked-screen.result == 'success') || ((((github.event_name == 'pull_request' && (github.event.label.name == 'run-gf2-taylor' || github.event.label.name == 'run-gf2-taylor-cohort' || (github.event.label.name == 'run-ham-taylor-strict' || (github.event.label.name == 'run-ham-affine-plan' || github.event.label.name == 'run-ham-affine-taylor'))) && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/mpfr-exact-residual-arena-reuse-20261118')) || (inputs.suite == 'focused' && inputs.case == 'feynman_gf2_8_mult')) && needs.original-long-tail-source-locked-screen.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.suite == 'full' && '["mqt_qnn_12","feynman_gf2_8_mult","feynman_ham15_med"]' || ((github.event.label.name == 'run-ham-taylor-strict' || (github.event.label.name == 'run-ham-affine-plan' || github.event.label.name == 'run-ham-affine-taylor')) && '["feynman_ham15_med"]' || github.event.label.name == 'run-gf2-taylor-cohort' && '["feynman_gf2_6_mult","feynman_gf2_8_mult"]' || '["feynman_gf2_8_mult"]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.case == 'feynman_gf2_6_mult' && 65 || 35 }}
    steps:
      - name: Checkout RaWMoCS research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original QuPRS
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Checkout unchanged original GPMC C++
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/mpfr_research -> target
          key: source-locked-high-cost-cohort
      - name: Require an explicit source artifact in focused pilot mode
        if: inputs.suite == 'focused'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Focused mode requires a numeric source_run_id"; exit 2; }
      - name: Download unmodified source and CNF screening artifact (full)
        if: inputs.suite == 'full'
        uses: actions/download-artifact@v4
        with:
          name: original-rawmocs-gpmc-long-tail-screen
          path: .research/long-tail
      - name: Reuse selected original source artifact (focused)
        if: inputs.suite == 'focused' || github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '45309819511' }}
          name: original-rawmocs-gpmc-long-tail-screen
          path: .research/long-tail
      - name: Verify source locks and install native MPFR libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = "0b28736651b3740ed3b201edd2efdef3da541e0d"
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = "89bbc89d0de918e7a5385740355df55765039230"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time pkg-config
      - name: Build original native GPMC C++
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Build source-locked RaWMoCS research MPFR solver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.label.name }}" == "run-ham-affine-plan" || "${{ github.event.label.name }}" == "run-ham-affine-taylor" ]]; then
            cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml factor_cardinality::affine::tests
            cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml packed_taylor::tests
          fi
          cargo build --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Time bounded 100/333-bit original-CNF Taylor or baseline pilot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_long_tail_paired.py
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_paired.py --self-test
          pilot=()
          if [[ "${{ github.event.label.name }}" == "run-ham-affine-taylor" ]]; then
            pilot+=(--ham-affine-taylor)
          elif [[ "${{ github.event.label.name }}" == "run-ham-affine-plan" ]]; then
            pilot+=(--ham-affine-plan)
          elif [[ "${{ github.event.label.name }}" == "run-ham-taylor-strict" ]]; then
            pilot+=(--ham-taylor-strict)
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pilot+=(--taylor-pilot)
            if [[ "${{ github.event.label.name }}" == "run-gf2-taylor-cohort" ]]; then pilot+=(--taylor-cohort); fi
          elif [[ "${{ inputs.suite }}" == "focused" ]]; then
            if [[ "${{ inputs.gf2_kernel }}" == "taylor" ]]; then pilot+=(--taylor-pilot); else pilot+=(--frontier-pilot); fi
          fi
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_paired.py \
            --stage pilot --pilot-case "${{ matrix.case }}" "${pilot[@]}" \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --corpus .research/long-tail \
            --report .research/long-tail/long-tail-source-locked-evidence.json \
            | tee ".research/long-tail/long-tail-pilot-${{ matrix.case }}.log"
      - name: Save independent case artifact even after timeout or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-rawmocs-gpmc-long-tail-${{ matrix.case }}-pilot
          path: |
            .research/long-tail/long-tail-pilot-${{ matrix.case }}.json
            .research/long-tail/long-tail-pilot-${{ matrix.case }}.log
          retention-days: 30
          if-no-files-found: warn

  original-gpmc-complete-rust-timeout-mechanism:
    # The user-valued long-tail counterexamples: original GPMC completes,
    # original-CNF Rust research solver exceeds symmetric 30s window.
    # 7 fresh alternating head-to-head trials per precision; GPMC feature
    # toggles are separate single-trial exploratory mechanism probes.
    needs: original-long-tail-source-locked-screen
    if: ${{ !cancelled() && ((inputs.suite == 'full' && needs.original-long-tail-source-locked-screen.result == 'success') || ((((github.event_name == 'pull_request' && (github.event.label.name == 'run-wstate-definitional' || (github.event.label.name == 'run-qwalk-definitional' || github.event.label.name == 'run-qwalk-guarded')) && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/mpfr-exact-residual-arena-reuse-20261118')) || (inputs.suite == 'focused' && inputs.case != 'feynman_gf2_8_mult' && inputs.case != 'mqt_qnn_12')) && needs.original-long-tail-source-locked-screen.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.suite == 'full' && '["feynman_gf2_6_mult","mqt_qnn_8","mqt_wstate_16","mqt_qwalk_5"]' || (github.event.label.name == 'run-wstate-definitional' && '["mqt_wstate_16"]' || (github.event.label.name == 'run-qwalk-definitional' || github.event.label.name == 'run-qwalk-guarded') && '["mqt_qwalk_5"]' || format('["{0}"]', inputs.case))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout RaWMoCS independent mechanism research
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned QuPRS original QASM corpus
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Checkout unchanged GPMC native C++ source
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/mpfr_research -> target
          key: source-locked-high-cost-cohort
      - name: Require an explicit source artifact in focused mode
        if: inputs.suite == 'focused'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Focused mode requires a numeric source_run_id"; exit 2; }
      - name: Download unchanged original source screening evidence (full)
        if: inputs.suite == 'full'
        uses: actions/download-artifact@v4
        with:
          name: original-rawmocs-gpmc-long-tail-screen
          path: .research/long-tail
      - name: Reuse source-locked artifact from selected run (focused)
        if: inputs.suite == 'focused' || github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '45309819511' }}
          name: original-rawmocs-gpmc-long-tail-screen
          path: .research/long-tail
      - name: Verify original upstream source locks and install MPFR
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = "0b28736651b3740ed3b201edd2efdef3da541e0d"
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = "89bbc89d0de918e7a5385740355df55765039230"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time pkg-config
      - name: Build pinned unchanged native GPMC
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Build same-source original-CNF MPFR Rust research solver
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml factor_indexed_fused::tests
          if [[ "${{ github.event.label.name }}" == "run-wstate-definitional" || "${{ github.event.label.name }}" == "run-qwalk-definitional" || "${{ github.event.label.name }}" == "run-qwalk-guarded" ]]; then
            cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml factor_cardinality:: 
          fi
          cargo build --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Same-source seven-trial 100/333-bit GPMC/Rust and GPMC mechanism toggles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_long_tail_mechanism.py
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_mechanism.py --self-test
          arms=(--indexed-fused)
          if [[ "${{ matrix.case }}" == "feynman_gf2_6_mult" ]]; then arms+=(--indexed-conditioned); fi
          if [[ "${{ inputs.suite }}" == "focused" && "${{ matrix.case }}" == "mqt_wstate_16" ]]; then arms=(--indexed-interned-only); fi
          if [[ "${{ github.event.label.name }}" == "run-wstate-definitional" || "${{ github.event.label.name }}" == "run-qwalk-definitional" || "${{ github.event.label.name }}" == "run-qwalk-guarded" ]]; then arms=(--definitional-only); fi
          if [[ "${{ github.event.label.name }}" == "run-qwalk-guarded" ]]; then
            python3 -m venv .research/qwalk-venv
            source .research/qwalk-venv/bin/activate
            python3 -m pip install numpy==2.2.6 mpmath==1.3.0
            export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
            arms=(--definitional-only --qwalk-guarded)
          fi
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_mechanism.py \
            "${arms[@]}" \
            --case "${{ matrix.case }}" \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --corpus .research/long-tail \
            --report ".research/long-tail/long-tail-mechanism-${{ matrix.case }}.json" \
            | tee ".research/long-tail/long-tail-mechanism-${{ matrix.case }}.log"
      - name: Save case-specific seven-trial raw and censored evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-rawmocs-gpmc-mechanism-${{ matrix.case }}
          path: |
            .research/long-tail/long-tail-mechanism-${{ matrix.case }}.json
            .research/long-tail/long-tail-mechanism-${{ matrix.case }}.log
          retention-days: 30
          if-no-files-found: warn

  original-qnn-cardinality-pilot:
    # Explicit label or manual dispatch only; no costly per-push campaign.
    if: ${{ (github.event_name == 'pull_request' && github.event.label.name == 'run-qnn-cardinality-native' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/mpfr-exact-residual-arena-reuse-20261118') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'focused' && inputs.case == 'mqt_qnn_12') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '45309819511' }}
          name: original-rawmocs-gpmc-long-tail-screen
          path: .research/long-tail
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit research-only Python dependencies and native GPMC libraries
        run: |
          python -m pip install numpy==2.2.6 networkx==3.4.2 mpmath==1.3.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time pkg-config
      - name: Build unmodified pinned original GPMC
        run: |
          set -euo pipefail
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = "89bbc89d0de918e7a5385740355df55765039230"
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/mpfr_research -> target
          key: source-locked-high-cost-cohort
      - name: Qualify native cardinality against exhaustive original-CNF oracle
        run: |
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml factor_cardinality::tests
          cargo build --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Same-run original QNN8 and QNN12 cardinality research pilot
        run: |
          set -euo pipefail
          mkdir -p .research/qnn-cardinality
          lscpu > .research/qnn-cardinality/cpu.txt
          python -m pip freeze > .research/qnn-cardinality/python-dependencies.txt
          git rev-parse HEAD > .research/qnn-cardinality/research-head.txt
          python -m py_compile benchmarks/mpfr_research/tools/quprs_qnn_cardinality_pilot.py
          python benchmarks/mpfr_research/tools/quprs_qnn_cardinality_pilot.py \
            --corpus .research/long-tail \
            --quprs .upstream/quprs --gpmc-source .upstream/gpmc \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --report .research/qnn-cardinality/pilot.json \
            | tee .research/qnn-cardinality/pilot.log
      - name: Preserve candidate, interval and censored control results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-qnn-cardinality-pilot
          path: .research/qnn-cardinality/
          retention-days: 30
          if-no-files-found: warn
