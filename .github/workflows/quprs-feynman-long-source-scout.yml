name: Original larger Feynman QuPRS CNF bounded source scout

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: "Focused: one prior-source case; full: explicit nine-job campaign"
        type: choice
        required: true
        default: focused
        options: [focused, full]
      case:
        description: "One case for focused validation"
        type: choice
        required: true
        default: feynman_gf2_6_mult
        options: [feynman_gf2_6_mult, mqt_qnn_8, mqt_wstate_16, mqt_qwalk_5, feynman_gf2_8_mult, mqt_qnn_12]
      gf2_kernel:
        description: "Focused GF2^8 only: MPFR frontier or exact-decimal Taylor ring"
        type: choice
        required: true
        default: frontier
        options: [frontier, taylor]
      source_run_id:
        description: "Focused: existing run with verified source-screen artifact"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: original-feynman-scout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  bounded-original-feynman:
    if: inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout research scripts only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned, unchanged QuPRS original source
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Checkout unchanged pinned GPMC C++ source
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .upstream/quprs/rust -> target
          key: quprs-original-feynman-long-source
      - name: Verify both source versions and install native dependencies
        run: |
          test "$(git -C .upstream/quprs rev-parse HEAD)" = "0b28736651b3740ed3b201edd2efdef3da541e0d"
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = "89bbc89d0de918e7a5385740355df55765039230"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time
      - name: Build original QuPRS PathSum and WmcManager research source bridge
        run: |
          cp benchmarks/rust_core/tools/quprs_long_feynman_reference.rs \
            .upstream/quprs/rust/quprs/examples/quprs_long_feynman_reference.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_long_feynman_reference
      - name: Bounded export of four original committed Feynman QASM cases
        run: |
          mkdir -p .research/feynman-long
          EXPORTER="$GITHUB_WORKSPACE/.upstream/quprs/rust/target/release/examples/quprs_long_feynman_reference"
          : > .research/feynman-long/source-status.tsv
          for family in feynman_mod_mult_55 feynman_barenco_tof_5 feynman_hwb6 feynman_grover_5; do
            echo "ORIGINAL_SOURCE_START $family"
            if timeout -k 2s 30s prlimit --as=2147483648 --fsize=2097152 -- \
              "$EXPORTER" "$family" \
              "$GITHUB_WORKSPACE/.upstream/quprs" \
              "$GITHUB_WORKSPACE/.research/feynman-long" \
              > ".research/feynman-long/$family.export.log" 2>&1; then
              printf '%s\tEXPORTED\n' "$family" >> .research/feynman-long/source-status.tsv
              echo "ORIGINAL_SOURCE_FINISHED $family"
            else
              printf '%s\tEXPORT_CENSORED_OR_UNSUPPORTED\n' "$family" >> .research/feynman-long/source-status.tsv
              echo "ORIGINAL_SOURCE_CENSORED $family"
            fi
          done
      - name: Build unchanged GPMC C++ native executable
        run: |
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/mpfr_research -> target
          key: mpfr-rawmocs-original-feynman-scout
      - name: Build same-bit RaWMoCS research MPFR release executable
        run: |
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml
          cargo build --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Source and bounded same-MPFR native paired scout
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_long_feynman_pilot.py
          python3 benchmarks/rust_core/tools/quprs_long_feynman_pilot.py \
            --source .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 2 \
            --report .research/feynman-long/scout-report.json
      - name: Bounded 250k and 1M node-cap experiment on original long Feynman CNFs
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_feynman_node_budget_ab.py
          python3 benchmarks/rust_core/tools/quprs_feynman_node_budget_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --report .research/feynman-long/node-budget-report.json
      - name: HWB6 and held-out original Feynman equal-MPFR shared Residual A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_shared_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_shared_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 3 \
            --report .research/feynman-long/shared-residual-ab.json
      - name: HWB6 original long-Feynman matched-GPMC indexed unit-propagation A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_indexed_unit_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_indexed_unit_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 3 \
            --report .research/feynman-long/indexed-unit-ab.json
      - name: Original HWB6 matched-MPFR bounded residual Cache capacity A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_cache_capacity_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_cache_capacity_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 5 \
            --report .research/feynman-long/cache-capacity-ab.json
      - name: Original Feynman matched-MPFR flat CSR occurrence propagation A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_csr_unit_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_csr_unit_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 5 \
            --report .research/feynman-long/csr-occurrence-ab.json
      - name: Source-locked GPMC equal-MPFR CSR x Cache 10k 25k 50k factorial
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_csr_cache_factorial_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_csr_cache_factorial_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 7 \
            --report .research/feynman-long/csr-cache-factorial-ab.json
      - name: Original Feynman equal-MPFR exact flat packed residual Cache memory and WallTime A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_packed_cache_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_packed_cache_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 7 \
            --report .research/feynman-long/packed-residual-cache-ab.json
      - name: Original Feynman matched-MPFR Packed fast admission solve-only and WallTime A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_packed_fast_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_packed_fast_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 7 \
            --report .research/feynman-long/packed-fast-admission-ab.json
      - name: Source-locked HWB6 and holdout 50k Packed 2x2 hash-versus-bypass ablation
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_packed_factor_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_packed_factor_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 5 \
            --report .research/feynman-long/packed-factor-ablation.json
      - name: Original HWB6 same-bit native per-node frequency scratch six-trial A/B
        run: |
          python3 -m py_compile benchmarks/rust_core/tools/quprs_mpfr_frequency_scratch_long_ab.py
          python3 benchmarks/rust_core/tools/quprs_mpfr_frequency_scratch_long_ab.py \
            --scout-report .research/feynman-long/scout-report.json \
            --node-report .research/feynman-long/node-budget-report.json \
            --corpus .research/feynman-long \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --trials 6 \
            --report .research/feynman-long/frequency-scratch-ab.json
      - name: Archive every source/solver outcome including censored cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-feynman-long-source-scout
          path: .research/feynman-long/
          if-no-files-found: warn
          retention-days: 30

  original-long-tail-source-locked-screen:
    # One existing workflow, no new workflows/environment/branch. This costly
    # study is limited to the research PR or explicit manual dispatch.
    if: inputs.suite == 'full' || (github.event_name == 'pull_request' && (github.event.label.name == 'run-gpmc-completer-scout' || github.event.label.name == 'run-mqt-long-holdouts' || github.event.label.name == 'run-mqt-locked-long' || github.event.label.name == 'run-mqt-residual-followup' || github.event.label.name == 'run-mqt-certified-long' || github.event.label.name == 'run-mqt-adaptive-scout' || github.event.label.name == 'run-qpe-resource-pilot' || github.event.label.name == 'run-qpe-certified-repeat' || github.event.label.name == 'run-qpe-independent-prejoin' || github.event.label.name == 'run-qft-prejoin-pilot' || github.event.label.name == 'run-prejoin-recycle-ab' || github.event.label.name == 'run-prejoin-support-ab' || github.event.label.name == 'run-prejoin-planner-ab' || github.event.label.name == 'run-prejoin-long-profile' || github.event.label.name == 'run-prejoin-long-repeat' || github.event.label.name == 'run-prejoin-long-scout' || (github.event.label.name == 'run-prejoin-hard-holdouts' || github.event.label.name == 'run-prejoin-hard-repeat')) && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/mpfr-exact-residual-arena-reuse-20261118')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event.label.name == 'run-qpe-independent-prejoin' || github.event.label.name == 'run-qft-prejoin-pilot' || github.event.label.name == 'run-prejoin-long-scout' || (github.event.label.name == 'run-prejoin-hard-holdouts' || github.event.label.name == 'run-prejoin-hard-repeat')) && 20 || github.event.label.name == 'run-mqt-adaptive-scout' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.label.name == 'run-prejoin-recycle-ab' && '[0,1]' || github.event.label.name == 'run-prejoin-support-ab' && '[0,1]' || github.event.label.name == 'run-prejoin-planner-ab' && '[0,1]' || github.event.label.name == 'run-prejoin-long-profile' && '[0,1]' || github.event.label.name == 'run-prejoin-long-repeat' && '[0,1]' || github.event.label.name == 'run-prejoin-long-scout' && '[0,1]' || github.event.label.name == 'run-prejoin-hard-repeat' && '[0,1,2,3]' || github.event.label.name == 'run-prejoin-hard-holdouts' && '[0,1]' || github.event.label.name == 'run-qpe-independent-prejoin' && '[0,1,2,3]' || github.event.label.name == 'run-mqt-certified-long' && '[0,1,2,3]' || github.event.label.name == 'run-mqt-residual-followup' && '[0,1]' || github.event.label.name == 'run-mqt-locked-long' && '[0,1,2,3]' || github.event.label.name == 'run-mqt-long-holdouts' && '[0,1,2,3]' || github.event.label.name == 'run-qpe-certified-repeat' && '[0,1,2]' || (github.event.label.name == 'run-mqt-adaptive-scout' || github.event.label.name == 'run-qpe-resource-pilot') && '[0,1,2,3]' || github.event.label.name == 'run-gpmc-completer-scout' && '[0,1,2]' || '[0]') }}
    steps:
      - name: Checkout RaWMoCS research-only exporter and runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pre-bitmask planner baseline
        if: github.event.label.name == 'run-prejoin-planner-ab' || github.event.label.name == 'run-prejoin-support-ab' || github.event.label.name == 'run-prejoin-recycle-ab'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.label.name == 'run-prejoin-recycle-ab' && '6e1d3deb998e0cae186c5751914e6275bc8b37ef' || github.event.label.name == 'run-prejoin-support-ab' && '3a91f438d24793cefe8a63704b1075a7381ca5b0' || '2fbdda903101b3787c83d05316a2fe08133804de' }}
          path: .upstream/planner-baseline
          persist-credentials: false
      - name: Checkout exactly pinned original QuPRS QASM corpus
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - name: Checkout exactly pinned original C++ GPMC and submodules
        uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .upstream/gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .upstream/quprs/rust -> target
            benchmarks/mpfr_research -> target
          key: source-locked-high-cost-cohort
      - name: Verify source locks and install native GPMC/Rust MPFR libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/quprs rev-parse HEAD)" = "0b28736651b3740ed3b201edd2efdef3da541e0d"
          test "$(git -C .upstream/gpmc rev-parse HEAD)" = "89bbc89d0de918e7a5385740355df55765039230"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time pkg-config
      - name: Independently compile original QuPRS Feynman and MQT source exporter
        shell: bash
        run: |
          set -euo pipefail
          cp benchmarks/rust_core/tools/quprs_long_tail_source_bridge.rs \
            .upstream/quprs/rust/quprs/examples/quprs_long_tail_source_bridge.rs
          cargo build --locked --release --no-default-features \
            --manifest-path .upstream/quprs/rust/Cargo.toml \
            -p quprs --example quprs_long_tail_source_bridge
      - name: Compile unmodified pinned C++ GPMC
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .upstream/gpmc -B .upstream/gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream/gpmc/build --target gpmc-bin --parallel 2
      - name: Qualify research MPFR signed-Complex accuracy and compile native Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path benchmarks/mpfr_research/Cargo.toml
          cargo build --release --manifest-path benchmarks/mpfr_research/Cargo.toml
      - name: Original source 16-case GPMC/Rust 30s screens
        if: inputs.suite == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/long-tail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_long_tail_paired.py
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_paired.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_paired.py \
            --stage screen \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --exporter .upstream/quprs/rust/target/release/examples/quprs_long_tail_source_bridge \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --corpus .research/long-tail \
            --report .research/long-tail/long-tail-source-locked-evidence.json \
            | tee .research/long-tail/long-tail-scout.log
      - name: Original source Weighted-safe SCC structural preflight and audit
        if: inputs.suite == 'full'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_long_tail_scc_poc.py
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_scc_poc.py --self-test
          python3 benchmarks/mpfr_research/tools/quprs_long_tail_scc_poc.py \
            --screen-report .research/long-tail/long-tail-source-locked-evidence.json \
            --corpus .research/long-tail \
            --report .research/long-tail/scc-source-locked-audit.json
      - name: GPMC-completer-first original-source long-case discovery and paired probe
        if: github.event.label.name == 'run-gpmc-completer-scout'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/long-tail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_gpmc_completer_scout.py
          python3 benchmarks/mpfr_research/tools/quprs_gpmc_completer_scout.py \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --exporter .upstream/quprs/rust/target/release/examples/quprs_long_tail_source_bridge \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --corpus .research/long-tail \
            --report .research/long-tail/completer-scout.json \
            --shard ${{ matrix.shard }} | tee .research/long-tail/completer-scout.log
      - name: Original MQT cross-family adaptive routing and generic hybrid ablation
        if: github.event.label.name == 'run-mqt-adaptive-scout'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/long-tail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_mqt_adaptive_scout.py
          python3 benchmarks/mpfr_research/tools/quprs_mqt_adaptive_scout.py \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --exporter .upstream/quprs/rust/target/release/examples/quprs_long_tail_source_bridge \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --corpus .research/long-tail \
            --report .research/long-tail/mqt-adaptive-scout.json \
            --shard ${{ matrix.shard }} | tee .research/long-tail/mqt-adaptive-scout.log
      - name: QPE resource-qualified contraction and Graphstate guarded accuracy
        if: github.event.label.name == 'run-qpe-resource-pilot'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/long-tail
          if [[ "${{ matrix.shard }}" == "3" ]]; then
            python3 -m venv .research/graphstate-venv
            source .research/graphstate-venv/bin/activate
            python3 -m pip install numpy==2.2.6 mpmath==1.3.0
          fi
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_qpe_resource_pilot.py
          python3 benchmarks/mpfr_research/tools/quprs_qpe_resource_pilot.py \
            --quprs .upstream/quprs \
            --gpmc-source .upstream/gpmc \
            --exporter .upstream/quprs/rust/target/release/examples/quprs_long_tail_source_bridge \
            --gpmc .upstream/gpmc/build/gpmc \
            --mpfr benchmarks/mpfr_research/target/release/rawmocs-mpfr-research \
            --corpus .research/long-tail \
            --report .research/long-tail/qpe-resource-pilot.json \
            --shard ${{ matrix.shard }} | tee .research/long-tail/qpe-resource-pilot.log
      - name: GPMC-completer-first larger GF2 and QNN prejoin scout
        if: github.event.label.name == 'run-prejoin-long-scout'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research/long-tail
          python3 -m py_compile benchmarks/mpfr_research/tools/quprs_prejoin_long_holdout.py
          python3 benchmarks/mpfr_research/tools/quprs_prejoin_long_holdout.py \
            --quprs .upstream/quprs \
