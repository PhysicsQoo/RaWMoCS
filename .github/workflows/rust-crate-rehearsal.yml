name: Rust crate distribution rehearsal
on:
  push:
    branches: [experiment/rust-crate-distribution]
    paths:
      - 'crates/rawmocs-*/**'
      - 'packaging/rawmocs/**'
      - 'pyproject.toml'
      - 'scripts/verify_v040_version_scope.py'
      - 'scripts/rehearse_v040_source.sh'
      - 'scripts/stage_single_rust_crate.py'
      - 'scripts/rehearse_single_rust_crate.sh'
      - 'scripts/check_rawmocs_registry_name.sh'
      - '.github/workflows/rust-crate-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-crate-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact public registry name (no write)
        run: bash scripts/check_rawmocs_registry_name.sh "$RUNNER_TEMP/name"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-registry-name
          path: ${{ runner.temp }}/name/
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends m4 make gcc libgmp-dev libmpfr-dev
      - name: Build and verify single publishable package
        run: bash scripts/rehearse_single_rust_crate.sh "$RUNNER_TEMP/single"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-single-crate-rehearsal
          path: ${{ runner.temp }}/single/
          if-no-files-found: warn
  source-version-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends m4 make gcc libgmp-dev libmpfr-dev
      - name: Verify version parity and rebuild CLI and Python source archives
        run: bash scripts/rehearse_v040_source.sh "$RUNNER_TEMP/v040-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v040-source-admission
          path: ${{ runner.temp }}/v040-source/
          if-no-files-found: warn
