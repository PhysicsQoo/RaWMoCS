name: Rust crate distribution rehearsal
on:
  push:
    branches: [experiment/rust-crate-distribution]
    paths:
      - 'crates/rawmocs-*/**'
      - 'scripts/rehearse_rust_crates.sh'
      - '.github/workflows/rust-crate-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-crate-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends m4 make gcc libgmp-dev libmpfr-dev
      - name: Rehearse package distribution from source archives
        run: bash scripts/rehearse_rust_crates.sh "$GITHUB_WORKSPACE/.r2-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-crate-distribution-rehearsal
          path: .r2-evidence/
          include-hidden-files: true
          if-no-files-found: warn
