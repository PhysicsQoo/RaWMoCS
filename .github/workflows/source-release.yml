name: Publish admitted source release

on:
  push:
    branches: [main]
    paths:
      - 'releases/**'
      - 'scripts/release_source.py'
      - 'scripts/test_release_source.py'
      - 'scripts/release_v040.py'
      - 'scripts/release_python_source.py'
      - 'scripts/test_release_v040.py'
      - 'scripts/release_rc.py'
      - 'scripts/test_release_rc.py'
      - '.github/workflows/source-release.yml'
  pull_request:
    paths:
      - 'releases/**'
      - 'scripts/release_source.py'
      - 'scripts/test_release_source.py'
      - 'scripts/release_v040.py'
      - 'scripts/release_python_source.py'
      - 'scripts/test_release_v040.py'
      - 'scripts/release_rc.py'
      - 'scripts/test_release_rc.py'
      - '.github/workflows/source-release.yml'
  workflow_dispatch:
    inputs:
      registry_mode:
        description: 'Historical recovery or admitted stable OIDC release (explicit intent required)'
        type: choice
        options: [none, rc-preflight, rc-trusted, trusted, stable-preflight, stable-trusted]
        default: none

permissions:
  contents: read
  actions: read

concurrency:
  group: source-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pinned source release request (read only)
    if: (github.event_name == 'workflow_dispatch' && (inputs.registry_mode == 'none' || inputs.registry_mode == 'trusted')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v040]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.admit.outputs.version }}
      registry_state: ${{ steps.admit.outputs.registry_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release admission and draft-resume controls
        run: |
          python3 scripts/test_release_source.py
          python3 scripts/test_release_python_source.py
          python3 scripts/test_release_v040.py
          python3 scripts/test_release_rc.py
      - name: Verify workflow evidence and exact source archive
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_source.py validate
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,"scripts")
          from release_source import load_request, preflight_new_registry_upload
          from release_v040 import verify_oidc_receipt, checked_state
          r=load_request()
          if r["version"]=="0.4.0":
              verify_oidc_receipt(r)
              state=checked_state(r)
              print("V040_REGISTRY_PREFLIGHT",state)
              if state=="READY":
                  preflight_new_registry_upload(r)
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  print("registry_state="+state,file=out)
          PY
          python3 -c 'import json; print("version="+json.load(open("releases/request.json"))["version"])' >> "$GITHUB_OUTPUT"

  registry:
    name: Publish or verify the single rawmocs registry crate
    needs: validate
    if: github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/main' && needs.validate.outputs.version == '0.4.0' && needs.validate.outputs.registry_state == 'READY' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v040]')) || (github.event_name == 'workflow_dispatch' && inputs.registry_mode == 'trusted'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
      - name: Obtain short-lived OIDC token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish admitted stable crate using OIDC or verify identical existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/release_v040.py trusted

  publish:
    name: Publish verified source assets
    needs: [validate, registry]
    if: always() && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.registry_mode, 'rc-')) && needs.validate.result == 'success' && github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.validate.outputs.version != '0.4.0' || (((github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v040]')) || (github.event_name == 'workflow_dispatch' && inputs.registry_mode == 'trusted')) && (needs.registry.result == 'success' || (needs.registry.result == 'skipped' && needs.validate.outputs.registry_state == 'MATCH'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck request and publish a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_source.py publish

  rc-preflight:
    name: Read-only RC package admission
    if: github.repository == 'PhysicsQoo/RaWMoCS' && ((github.event_name == 'pull_request' && github.head_ref == 'release/rc-bootstrap' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && startsWith(inputs.registry_mode, 'rc-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
      - name: Native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends m4 make gcc libgmp-dev libmpfr-dev
      - name: Verify RC-only controls and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test_release_rc.py
          python3 scripts/release_rc.py prepare "$RUNNER_TEMP/rc"
      - uses: actions/upload-artifact@v4
        with:
          name: rawmocs-rc-admission
          path: ${{ runner.temp }}/rc/evidence/
          if-no-files-found: error

  rc-registry:
    name: RC-only registry bootstrap or OIDC readback
    needs: rc-preflight
    if: github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.registry_mode == 'rc-trusted'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
      - uses: actions/download-artifact@v4
        with:
          name: rawmocs-rc-admission
          path: ${{ runner.temp }}/admitted-rc
      - name: Reproduce admitted RC bytes without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_rc.py reproduce "$RUNNER_TEMP/rc" "$RUNNER_TEMP/admitted-rc"
      - name: Obtain short-lived OIDC token
        if: inputs.registry_mode == 'rc-trusted'
        id: rc-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Verify OIDC token and exact RC registry bytes, no republish
        if: inputs.registry_mode == 'rc-trusted'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.rc-auth.outputs.token }}
        run: python3 scripts/release_rc.py trusted "$RUNNER_TEMP/rc"
      - name: Install the RC from crates.io as independent consumer
        run: python3 scripts/release_rc.py consumer "$RUNNER_TEMP/rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-rc-registry-receipt
          path: ${{ runner.temp }}/rc/evidence/
          if-no-files-found: warn

  stable-validate:
    name: Validate immutable stable package request
    if: github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && startsWith(inputs.registry_mode, 'stable-')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-stable]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      registry_state: ${{ steps.admit.outputs.registry_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test stable release rejection controls
        run: python3 scripts/test_stable_release.py
      - name: Verify immutable package evidence and registry state
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stable_release.py validate

  stable-registry:
    name: Publish exact stable crate using OIDC
    needs: stable-validate
    if: needs.stable-validate.outputs.registry_state == 'READY' && ((github.event_name == 'workflow_dispatch' && inputs.registry_mode == 'stable-trusted') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-stable]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
      - name: Obtain short-lived OIDC token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Reproduce admitted bytes and publish or verify registry
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/stable_release.py registry

  stable-publish:
    name: Publish exact stable GitHub release
    needs: [stable-validate, stable-registry]
    if: always() && needs.stable-validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.registry_mode == 'stable-trusted') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-stable]'))) && (needs.stable-registry.result == 'success' || (needs.stable-registry.result == 'skipped' && needs.stable-validate.outputs.registry_state == 'MATCH'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify registry and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stable_release.py publish
