name: WASM W1b browser worker
on:
  push:
    branches: [experiment/wasm-w1b]
    paths: ['.github/workflows/wasm-w1b.yml', 'research/wasm_w1b/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-w1b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/experiment/wasm-w1b'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - name: Install browser and build tools
        run: |
          set -o pipefail
          (
            set -e
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends m4 make gcc
            python3 -m pip install playwright==1.65.2
            python3 -m playwright install --with-deps chromium
          ) 2>&1 | tee "$RUNNER_TEMP/wasm-w1b-setup.log"
      - name: Build and test exact released solver in browser worker
        run: python3 research/wasm_w1b/build.py "$RUNNER_TEMP/wasm-w1b"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-wasm-w1b-evidence
          path: |
            ${{ runner.temp }}/wasm-w1b/evidence/
            ${{ runner.temp }}/wasm-w1b-setup.log
          if-no-files-found: error
