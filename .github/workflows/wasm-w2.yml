name: WASM W2 source-phase bridge
on:
  push:
    branches: [experiment/wasm-w2]
    paths: ['.github/workflows/wasm-w2.yml','research/wasm_w2/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  phase:
    if: github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/experiment/wasm-w2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fast syntax preflight before installing dependencies
        run: |
          python3 -m py_compile research/wasm_w2/*.py research/wasm_w1b/browser_test.py
          node --check research/wasm_w2/phase-worker.js
          node --check research/wasm_w1b/worker.js
          echo W2_SYNTAX_PREFLIGHT_PASS
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 2a510a7bba0d5af612c84fc2822cc29bcea45daa
          path: quprs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 40b83fd2a70ce0608fece16bdfca7870db1cc7c3
          path: parser-fix
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - name: Install bounded test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends m4 make gcc g++ cmake libgmp-dev libmpfr-dev zlib1g-dev
          python3 -m pip install playwright==1.65.2
          python3 -m playwright install --with-deps chromium
      - name: Download exact W1c candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/w2/evidence"
          gh api repos/PhysicsQoo/RaWMoCS/actions/artifacts/15257956508/zip > "$RUNNER_TEMP/w2/w1c.zip"
          echo '9165b990cc77f7a625c27b66eda4cde6521509caaffabac48ad7a767f24feeef  '"$RUNNER_TEMP/w2/w1c.zip" | sha256sum -c -
      - name: Original QuPRS MPFR bridge and fixed private candidate parity
        run: python3 research/wasm_w2/gate.py "$RUNNER_TEMP/w2" "$GITHUB_WORKSPACE/quprs" "$GITHUB_WORKSPACE/parser-fix"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-wasm-w2-evidence
          path: ${{ runner.temp }}/w2/evidence/
          if-no-files-found: error
