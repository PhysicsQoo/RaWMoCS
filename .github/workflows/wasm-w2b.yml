name: WASM W2b QuPRS capture replay
on:
  push:
    branches: [experiment/wasm-w2]
    paths: ['.github/workflows/wasm-w2b.yml','research/wasm_w2b/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.repository == 'PhysicsQoo/RaWMoCS' && github.ref == 'refs/heads/experiment/wasm-w2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUPRS_SOLVER_PROVISION: external
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax preflight
        run: python3 -m py_compile research/wasm_w2b/*.py
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 2a510a7bba0d5af612c84fc2822cc29bcea45daa
          path: quprs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.1'
          targets: wasm32-unknown-unknown
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - name: Install bounded dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends m4 make gcc g++ cmake libgmp-dev libmpfr-dev zlib1g-dev
          python3 -m pip install playwright==1.65.2
          python3 -m playwright install --with-deps chromium
      - name: Download immutable W2a evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/w2b/evidence"
          gh api repos/PhysicsQoo/RaWMoCS/actions/artifacts/15259712439/zip > "$RUNNER_TEMP/w2b/w2a.zip"
          echo '2cc356553c0da8d2d2170aa7cb50299c3089135ecbe84c71e25b9f207e002b49  '"$RUNNER_TEMP/w2b/w2a.zip" | sha256sum -c -
      - name: Stage actual QuPRS core and run differential gate
        run: python3 research/wasm_w2b/gate.py "$RUNNER_TEMP/w2b" "$GITHUB_WORKSPACE/quprs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-wasm-w2b-evidence
          path: ${{ runner.temp }}/w2b/evidence/
          if-no-files-found: error
