name: Cross-platform direct-child lifecycle conformance

on:
  pull_request:
    paths:
      - "benchmarks/rust_core/examples/worker_contract.rs"
      - "benchmarks/rust_core/Cargo.toml"
      - ".github/workflows/worker-contract.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/rust_core/examples/worker_contract.rs"
      - "benchmarks/rust_core/Cargo.toml"
      - ".github/workflows/worker-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-child-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust_core -> target
      - name: Format and lint portable contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path benchmarks/rust_core/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path benchmarks/rust_core/Cargo.toml --example worker_contract -- -D warnings
      - name: Cross-platform direct-child lifecycle and fail-closed outcome controls
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path benchmarks/rust_core/Cargo.toml --example worker_contract -- --self-test | tee "$RUNNER_TEMP/worker-contract.log"
          for label in COMPLETED SOLVER_ERROR UNKNOWN_EXIT UNVERIFIED_MEMORY_EXIT TIMEOUT CANCELLED PRE_CANCELLED; do
            grep -Fx "CONTRACT_${label}=PASS" "$RUNNER_TEMP/worker-contract.log"
          done
          for capability in HARD_RSS PROCESS_TREE LINUX_CGROUP_V2 WINDOWS_JOB_OBJECT MACOS_MEMORY_ENFORCEMENT; do
            grep -Fx "CONTRACT_${capability}=UNSUPPORTED" "$RUNNER_TEMP/worker-contract.log"
          done
          grep -Fx "WORKER_LIFECYCLE_DIRECT_CHILD_CONFORMANCE=PASS" "$RUNNER_TEMP/worker-contract.log"
      - name: Archive OS conformance status
        uses: actions/upload-artifact@v4
        with:
          name: direct-child-contract-${{ matrix.os }}
          path: ${{ runner.temp }}/worker-contract.log
          retention-days: 30
          if-no-files-found: error
