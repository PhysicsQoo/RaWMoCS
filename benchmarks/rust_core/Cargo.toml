# Independent benchmark workspace; no core release dependency changes.
[package]
name = "rawmocs-benchmarks"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[features]
cache-cost-profile = ["rawmocs-core/cache-cost-profile"]
cache-admission-research = ["rawmocs-core/cache-admission-research"]
# Benchmark fixture reuse only: does not activate a cache-admission policy.
branching-research = ["rawmocs-core/branching-research", "cache-admission-research"]
# Opt-in only; do not alter default CodSpeed or release builds.
canonical-mul-research = ["rawmocs-core/canonical-mul-research"]

[workspace]

[dependencies]
rawmocs-core = { path = "../../crates/rawmocs-core" }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "=6.0.0" }

[[bench]]
name = "solver"
harness = false

[[example]]
name = "canonical_mul_paired"
required-features = ["canonical-mul-research"]

[[example]]
name = "canonical_admission_paired"
required-features = ["canonical-mul-research"]

[[example]]
name = "canonical_normalization_paired"
required-features = ["canonical-mul-research"]

[[example]]
name = "canonical_prepared_paired"
required-features = ["canonical-mul-research"]

[[example]]
name = "satlib_prepared_paired"
required-features = ["canonical-mul-research"]

[[example]]
name = "dubois_bounded_paired"
required-features = ["canonical-mul-research"]
