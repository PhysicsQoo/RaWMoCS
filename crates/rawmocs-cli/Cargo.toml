[package]
name = "rawmocs-cli"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

# Keep the MPFR/GMP executable independent of the portable reference workspace.
[workspace]

[lib]
name = "rawmocs_mpfr"
path = "src/lib.rs"

[[bin]]
name = "rawmocs"
path = "src/main.rs"

[[test]]
name = "native_stdio"
path = "tests/native_stdio.rs"
harness = false

[features]
# Research-only opt-in; default solver behavior is unchanged.
m1-last-use-reuse = []
m2-buffer-reuse = ["m1-last-use-reuse"]

[dependencies]
rug = { version = "=1.30.0", default-features = false, features = ["integer", "rational", "float", "std"] }
num-rational = "0.4"
rawmocs-core = { path = "../rawmocs-core" }
