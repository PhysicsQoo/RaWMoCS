[package]
name = "rawmocs-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Explicitly opt-in research profiling; never enabled for the default solver.
[features]
cache-cost-profile = []
cache-admission-research = []
branching-research = []

[dependencies]
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde_json = "1"
num-bigint = "0.4"
