[package]
name = "rawmocs-python"
version = "0.5.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Forward the research-only core feature; ordinary wheels remain unchanged.
m1-last-use-reuse = ["rawmocs_mpfr/m1-last-use-reuse"]
m2-buffer-reuse = ["m1-last-use-reuse", "rawmocs_mpfr/m2-buffer-reuse"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module"] }
rawmocs_mpfr = { package = "rawmocs-cli", path = "../rawmocs-cli", version = "=0.5.0" }
