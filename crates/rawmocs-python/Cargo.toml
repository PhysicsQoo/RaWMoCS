[package]
name = "rawmocs-python"
version = "0.3.0-alpha.1"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module"] }
rawmocs_mpfr = { package = "rawmocs-cli", path = "../rawmocs-cli", version = "=0.2.2" }
