[build-system]
requires = ["maturin==1.8.3"]
build-backend = "maturin"

[project]
name = "rawmocs"
version = "0.3.0"
description = "Native signed-complex weighted model counting with RaWMoCS"
requires-python = ">=3.12,<3.13"

[tool.maturin]
manifest-path = "crates/rawmocs-python/Cargo.toml"
python-source = "python"
module-name = "rawmocs._native"
include = [{ path = "LICENSE", format = "sdist" }]
